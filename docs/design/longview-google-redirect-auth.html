<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Longview Google redirect authentication review</title>
  <style>
    :root{color-scheme:dark;--bg:#061321;--card:#0b2030;--line:#28475b;--ink:#f5f0e7;--muted:#a9bbc7;--accent:#79d6c8;--warn:#e8b34d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#123e55,var(--bg) 45%);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.bar{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 5vw;background:#07131eef;border-bottom:1px solid var(--line)}.bar strong{color:var(--accent);letter-spacing:.18em;text-transform:uppercase}.bar div{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:10px;padding:12px 16px;background:#173b51;color:var(--ink);font:700 inherit;cursor:pointer}button.primary{background:var(--accent);color:#06212a;border-color:var(--accent)}main{min-height:calc(100vh - 74px);display:grid;place-items:center;padding:32px 20px}.card{width:min(820px,100%);padding:clamp(24px,5vw,56px);border:1px solid var(--line);border-radius:24px;background:#0a1d2beb;box-shadow:0 24px 80px #0006}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.16em;text-transform:uppercase}.card h1{max-width:680px;margin:.35em 0;font:700 clamp(40px,7vw,76px)/.98 Georgia,serif}.card p{max-width:680px;color:var(--muted);font-size:18px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.notice{margin-top:22px;padding:16px;border:1px solid var(--warn);border-radius:12px;background:#3f3014;color:#ffe7af}.progress{height:6px;margin:24px 0;border-radius:20px;overflow:hidden;background:#173447}.progress span{display:block;width:38%;height:100%;background:var(--accent);animation:move 1.2s infinite ease-in-out}@keyframes move{50%{transform:translateX(165%)}}@media(max-width:600px){.bar{align-items:flex-start;flex-direction:column}.card h1{font-size:42px}.actions button{width:100%}}
  </style>
</head>
<body>
  <header class="bar"><strong>Longview · redirect auth review</strong><div><button data-screen="signin">Sign in</button><button data-screen="redirect">Redirecting</button><button data-screen="success">Success</button><button data-screen="failure">Failure</button><button data-screen="conflict">Link conflict</button></div></header>
  <main id="app"></main>
  <script>
    const screens={
      signin:`<section class="card"><span class="eyebrow">Choose how to begin</span><h1>Make progress without rebuilding the plan every day.</h1><p>Use Google for access across devices, or start without sharing personal information.</p><div class="actions"><button class="primary" data-screen="redirect">Continue with Google</button><button data-screen="success">Continue anonymously</button></div></section>`,
      redirect:`<section class="card" aria-busy="true"><span class="eyebrow">Secure sign-in</span><h1>Taking you to Google…</h1><p>This tab will return to Longview after you choose an account. No extra window needs to stay open.</p><div class="progress" role="progressbar" aria-label="Opening Google sign-in"><span></span></div><div class="actions"><button data-screen="success">Simulate return</button><button data-screen="failure">Simulate safe failure</button></div></section>`,
      success:`<section class="card"><span class="eyebrow">Workspace ready</span><h1>Welcome back.</h1><p>Your Google account has restored the same Longview workspace. Reloading keeps you signed in.</p><div class="actions"><button class="primary" data-screen="signin">Open Today</button></div></section>`,
      failure:`<section class="card"><span class="eyebrow">Nothing changed</span><h1>Sign-in could not be completed.</h1><div class="notice" role="alert">Try Google again, or continue without Google. No workspace or Plan was changed.</div><div class="actions"><button class="primary" data-screen="redirect">Try Google again</button><button data-screen="success">Continue anonymously</button></div></section>`,
      conflict:`<section class="card"><span class="eyebrow">Anonymous workspace protected</span><h1>That Google account is already connected.</h1><div class="notice" role="alert">Your current anonymous workspace was not merged or changed.</div><div class="actions"><button class="primary" data-screen="redirect">Use existing Google workspace</button><button data-screen="success">Keep using this workspace</button></div></section>`
    };
    const app=document.getElementById('app');function show(name){app.innerHTML=screens[name]||screens.signin}document.addEventListener('click',event=>{const target=event.target.closest('[data-screen]');if(target)show(target.dataset.screen)});show('signin');
  </script>
</body>
</html>
