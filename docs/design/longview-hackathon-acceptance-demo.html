<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Longview hackathon acceptance demo</title>
  <style>
    :root{color-scheme:dark;--bg:#06131f;--panel:#0b1d2b;--panel2:#102839;--line:#29495d;--ink:#f4f0e8;--muted:#9db2bf;--mint:#77d4c8;--blue:#70b7ee;--amber:#f0bf68;--rose:#ef91a8;--green:#73d0a6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}button,input{font:inherit}button{color:inherit}.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:18px;padding:15px 20px;border-bottom:1px solid var(--line);background:rgba(6,19,31,.96);backdrop-filter:blur(12px)}.brand{font:700 20px/1.1 Georgia,serif}.brand small{display:block;margin-top:5px;color:var(--mint);font:700 10px/1 system-ui;text-transform:uppercase;letter-spacing:.12em}.progress{flex:1;display:flex;align-items:center;gap:12px}.track{flex:1;height:8px;overflow:hidden;border-radius:99px;background:#193244}.track i{display:block;height:100%;background:var(--mint);transition:width .25s}.top-actions{display:flex;gap:8px}.btn{min-height:38px;padding:8px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer}.btn:hover,.btn:focus-visible{border-color:var(--mint);outline:none}.btn.primary{background:var(--mint);border-color:var(--mint);color:#06221f;font-weight:800}.layout{display:grid;grid-template-columns:340px minmax(420px,1fr) 360px;min-height:calc(100vh - 70px)}.cases{border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 70px)}.filters{position:sticky;top:0;z-index:2;padding:12px;border-bottom:1px solid var(--line);background:var(--panel)}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#071723;color:var(--ink)}.filter-row{display:flex;gap:6px;margin-top:8px;overflow:auto}.filter{white-space:nowrap;padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);cursor:pointer}.filter.on{color:#06221f;background:var(--mint);border-color:var(--mint)}.group-title{padding:14px 14px 7px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.case{width:100%;display:grid;grid-template-columns:28px 1fr auto;gap:9px;align-items:start;padding:11px 14px;border:0;border-top:1px solid rgba(41,73,93,.55);background:transparent;text-align:left;cursor:pointer}.case:hover,.case.on{background:var(--panel2)}.case.on{box-shadow:inset 3px 0 var(--mint)}.case .num{display:grid;place-items:center;width:25px;height:25px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px}.case b{display:block}.case small{display:block;margin-top:3px;color:var(--muted)}.badges{display:flex;gap:4px;align-items:center}.badge{padding:3px 6px;border-radius:99px;font-size:9px;font-weight:800;text-transform:uppercase}.implemented{color:var(--green);background:#12372f}.partial{color:var(--amber);background:#3a2d17}.missing{color:var(--rose);background:#3b1d29}.reviewed{color:var(--mint);background:#163a40}.stage{position:relative;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#12364a 0,transparent 45%)}.device{width:min(430px,100%);height:min(820px,calc(100vh - 118px));min-height:620px;overflow:hidden;border:1px solid #3b6076;border-radius:28px;background:#071722;box-shadow:0 24px 65px #0009}.device iframe{width:100%;height:100%;border:0;background:#071722}.detail{padding:24px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 70px)}.detail h1{margin:10px 0 8px;font:700 30px/1.08 Georgia,serif}.detail h2{margin:24px 0 8px;font-size:13px}.detail p{color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:6px}.requirement{padding:14px;border:1px solid var(--line);border-radius:12px;background:#071722}.steps{list-style:none;margin:0;padding:0}.steps li{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid rgba(41,73,93,.5)}.steps input{accent-color:var(--mint)}.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.disclosure{margin-top:18px;padding:12px;border:1px solid var(--amber);border-radius:12px;background:#332713;color:#ffe4a8;font-size:12px}.empty{padding:30px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:300px 1fr}.detail{grid-column:1/-1;max-height:none;border-left:0;border-top:1px solid var(--line)}.cases{max-height:720px}.device{height:760px}}@media(max-width:720px){.top{align-items:flex-start;flex-wrap:wrap}.progress{order:3;flex-basis:100%}.layout{display:block}.cases{max-height:420px;border-right:0;border-bottom:1px solid var(--line)}.stage{padding:14px}.device{height:720px}.detail{padding:18px}.top-actions .btn:not(.primary){display:none}}
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">Longview<small>Hackathon acceptance demo · simulated states</small></div>
    <div class="progress"><div class="track"><i id="progressBar"></i></div><strong id="progressText">0 / 0 reviewed</strong></div>
    <div class="top-actions"><button class="btn" id="runAll">Run all</button><button class="btn" id="resetReview">Reset review</button><button class="btn primary" id="toggleReviewed">Mark reviewed</button></div>
  </header>
  <main class="layout">
    <aside class="cases">
      <div class="filters"><input class="search" id="search" aria-label="Search acceptance cases" placeholder="Search cases"><div class="filter-row" id="filters"></div></div>
      <div id="caseList"></div>
    </aside>
    <section class="stage" aria-label="Interactive PWA simulation"><div class="device"><iframe id="prototype" title="Longview interactive acceptance state"></iframe></div></section>
    <aside class="detail" id="detail"></aside>
  </main>
  <script>
    const cases = [
      ['Identity','AUTH-01','Welcome and sign-in choices','auth','normal','implemented','P0','A judge can choose anonymous or Google access without losing a workspace.',['Use Continue anonymously and verify setup continues.','Return and inspect Google sign-in choice.','Verify linking language promises no silent merge.']],
      ['Identity','AUTH-02','Authentication cancellation','auth','auth-error','implemented','P0','Cancelled authentication returns safely with no account or workspace mutation.',['Inspect the failure message.','Verify anonymous continuation remains available.','Return to normal and retry.']],
      ['Identity','AUTH-03','Popup blocked','auth','auth-popup','implemented','P0','A blocked Google popup explains recovery without discarding local progress.',['Inspect the popup guidance.','Verify retry and anonymous paths remain available.']],
      ['Identity','AUTH-04','Account-link conflict','auth','auth-conflict','implemented','P0','An existing Google workspace is never silently merged with anonymous work.',['Verify the anonymous workspace is preserved.','Use the explicit existing-workspace action.']],
      ['Identity','AUTH-05','Workspace provisioning failure','auth','workspace-error','implemented','P0','Provisioning failure retains the authenticated account and exposes retry.',['Inspect the safe failure copy.','Retry workspace setup.']],
      ['Identity','AUTH-06','Anonymous sign-out protection','settings','normal','implemented','P0','Anonymous users are warned that MVP recovery is unavailable and can link Google first.',['Open Settings.','Verify Link account is visible before sign-out.','Confirm no workspace deletion is implied.']],

      ['Plan schedule','SCHED-01','Choose Plan working days','plan-confirm','normal','implemented','P0','Plan creation persists at least one working day and its weekly allocation.',['Choose several days.','Review the weekly allocation.','Create the Plan and verify Details.']],
      ['Plan schedule','SCHED-02','No working day selected','plan-confirm','plan-schedule-empty','implemented','P0','A Plan cannot be created without at least one working day.',['Clear all working days.','Attempt to review.','Verify no Plan is created.']],
      ['Plan schedule','SCHED-03','Schedule save failure','goal','plan-schedule-save-error','implemented','P0','A failed schedule edit retains the accepted Plan and draft for retry.',['Inspect the save failure.','Verify the Plan is unchanged.','Retry the same edit.']],
      ['Plan schedule','SCHED-04','Edit schedule from Plan Details','goal','normal','implemented','P0','Plan Details edits that Plan’s working days and weekly allocation.',['Open a Plan.','Edit its schedule.','Verify other Plans are unchanged.']],
      ['Plan schedule','SCHED-05','Concurrent schedule edit','goal','plan-schedule-conflict','implemented','P0','A stale Plan schedule never overwrites a newer accepted version.',['Inspect the conflict message.','Reload the Plan.','Verify the stale draft was not saved.']],
      ['Plan schedule','SCHED-06','Existing Plan without schedule','goal','plan-schedule-unset','implemented','P0','An existing unscheduled Plan remains readable and offers Add schedule.',['Open the existing Plan.','Use Add schedule.','Save days without changing Plan content.']],

      ['Plans','PLAN-01','Create and review Plan','plan-create','normal','implemented','P0','A user reviews title, outcome, rationale, target, and capacity before creation.',['Enter Plan and rationale.','Shape the Plan.','Review before creating.']],
      ['Plans','PLAN-02','Plan save failure and retry','plan-confirm','plan-save-error','implemented','P0','Failed creation preserves the review and retries with the same request identifier.',['Inspect the save failure.','Retry creation.','Verify no duplicate Plan.']],
      ['Plans','PLAN-03','Plans loading','portfolio','plans-loading','implemented','P0','The Plans surface distinguishes loading from empty.',['Verify the loading state has no create-empty claim.']],
      ['Plans','PLAN-04','Plans empty','portfolio','plans-empty','implemented','P0','A confirmed empty list offers Plan creation.',['Use Create a Plan.']],
      ['Plans','PLAN-05','Plans load failure','portfolio','plans-load-error','implemented','P0','Failed reads preserve data and expose retry.',['Inspect safe copy.','Retry without leaving the surface.']],
      ['Plans','PLAN-06','Finite-capacity portfolio','portfolio','normal','missing','P0','Three active Plans share visible capacity, operating modes, milestones, and tradeoffs.',['Inspect 6/4/2 allocation.','Open each Plan card.','Verify one cross-Plan recommendation.']],
      ['Plans','PLAN-07','Plan Details','goal','normal','missing','P0','Every Plan opens details with outcome, rationale, target, working days, current step, and context.',['Open a Plan from Portfolio.','Open the current task.','Inspect history, decisions, research, and brief links.']],
      ['Plans','PLAN-08','Plan missing','goal','plan-details-missing','missing','P0','A missing Plan offers a safe route back without showing stale content.',['Inspect missing-state copy.','Return to Plans.']],
      ['Plans','PLAN-09','Plan details load failure','goal','plan-details-error','missing','P0','A details read failure leaves the Plan unchanged and provides retry.',['Inspect the failure state.','Retry the same Plan.']],

      ['Today','TODAY-01','Prepared Today step','today','normal','implemented','P0','Today selects one bounded step from the nearest active Plan.',['Inspect Plan source, duration, and target.','Verify nothing was automatically changed.']],
      ['Today','TODAY-02','Nothing scheduled','today','no-task','partial','P0','An ineligible day names the next eligible working day.',['Verify no false ready claim.','Inspect the next eligible day.']],
      ['Today','TODAY-03','Today preparation failure','today','today-prepare-error','implemented','P0','Preparation failure preserves Plans and allows retry.',['Inspect recovery copy.','Retry or view Plans.']],
      ['Today','TODAY-04','Completion confirmation and cancel','completion-confirm','normal','implemented','P0','Completion requires explicit confirmation and cancellation leaves the step open.',['Choose Keep working.','Return and confirm completion.']],
      ['Today','TODAY-05','Completion save retry','completion-confirm','completion-save-error','implemented','P0','Failed completion remains open and retries idempotently.',['Inspect Not saved.','Retry with the same completion.']],
      ['Today','TODAY-06','Duplicate completion','completion-done','completion-duplicate','partial','P0','A duplicate completion returns the original result without another write.',['Inspect already-recorded state.','Verify one completion only.']],
      ['Today','TODAY-07','Offline pending sync','today','offline','partial','P0','Offline work is visibly pending and cannot duplicate on reconnect.',['Inspect pending status.','Verify last approved day remains readable.']],

      ['Clara','AI-01','Scoped read-only recommendation','clara-read','normal','partial','P0','Clara shows context, rationale, confidence, and no write capability.',['Inspect source facts.','Verify Nothing changed.']],
      ['Clara','AI-02','Clarification required','clara-read','clara-clarification','missing','P0','Insufficient context produces a question rather than a guessed recommendation.',['Inspect the missing fact.','Return without changes.']],
      ['Clara','AI-03','Recommendation timeout','clara-read','clara-timeout','partial','P0','Timeout stops safely and exposes retry.',['Verify Plan and Today remain unchanged.','Retry.']],
      ['Clara','AI-04','Malformed response','clara-read','clara-malformed','partial','P0','Invalid model output fails closed.',['Verify the response is rejected.','Return to Today unchanged.']],
      ['Clara','AI-05','Prompt-injection response rejected','clara-read','clara-injection','missing','P0','Untrusted instructions cannot expand context or authorize writes.',['Inspect rejection copy.','Verify no unrelated Plan data appears.']],
      ['Clara','AI-06','Service unavailable','clara-read','clara-error','partial','P0','Service failure preserves durable state and provides retry.',['Retry or return without changes.']],
      ['Clara','AI-07','Bounded Quick Actions','clara-actions','normal','missing','P0','Agent actions are grouped by outcome and map to typed tools.',['Open Plan my day.','Inspect safe-by-default disclosure.']],
      ['Clara','AI-08','Cross-Plan tradeoff','clara-chat','normal','missing','P0','A managed recommendation compares capacity and explains one concrete tradeoff.',['Inspect attached context.','Open the proposed change.']],
      ['Clara','AI-09','Exact change preview and cancel','clara-preview','normal','missing','P0','Before/after values, rationale, downstream effect, Approve, and Cancel precede a write.',['Inspect exact old/new values.','Cancel and verify no change.']],
      ['Clara','AI-10','Stale approval blocked','clara-preview','approval-stale','missing','P0','A stale expected version blocks approval and requires a refreshed preview.',['Inspect stale warning.','Refresh before applying.']],
      ['Clara','AI-11','Duplicate approval','clara-preview','approval-duplicate','missing','P0','A repeated approval returns the original audited result.',['Inspect already-applied state.','Verify no second move.']],

      ['Calendar','CAL-01','Prepare one day','calendar','normal','missing','P0','Only the selected day is generated and current capacity is explained.',['Prepare today.','Inspect the loading state and proposal.']],
      ['Calendar','CAL-02','Review and approve proposal','schedule-proposal','normal','missing','P0','A proposal supports Approve, Adjust, Try again, and break.',['Adjust without saving.','Return and approve.']],
      ['Calendar','CAL-03','Approved day','schedule-approved','normal','missing','P0','One approved day persists without touching future days.',['Inspect saved status.','Return to Today.']],
      ['Calendar','CAL-04','Schedule generation failure','calendar','schedule-error','missing','P0','Failed generation preserves the approved day and offers manual recovery.',['Try again.','Arrange manually or take a break.']],
      ['Calendar','CAL-05','Take a break','break-confirm','normal','missing','P1','A break carries tasks only to their next eligible working days.',['Inspect both moves.','Cancel, then confirm the break.']],

      ['Async run','RUN-01','Checkpointed background run','schedule-loading','normal','missing','P0','A worker exposes a correlated run identifier and recoverable checkpoints.',['Inspect running state.','Verify a visible run identifier in final evidence.']],
      ['Async run','RUN-02','Run cancellation','schedule-loading','run-cancelled','missing','P0','Cancellation stops future work and preserves the last checkpoint.',['Inspect cancelled state.','Resume or return unchanged.']],
      ['Async run','RUN-03','Run timeout','calendar','run-timeout','missing','P0','A timed-out run does not replace the approved schedule.',['Inspect timeout.','Retry with a new run identifier.']],
      ['Async run','RUN-04','Partial-write recovery','calendar','partial-recovery','missing','P0','Reconciliation completes or rolls back before success is shown.',['Inspect recovery status.','Verify no mixed schedule version.']],

      ['Memory','MEM-01','Research accept, reject, defer','research-cards','normal','missing','P1','Every evidence card remains attributable and user-reviewed.',['Accept one card.','Reject one card.','Leave one for later.']],
      ['Memory','MEM-02','Research unavailable','research','research-error','missing','P1','Research failure preserves saved cards and the current brief.',['Retry or review saved cards.']],
      ['Memory','MEM-03','Brief proposal and version','brief-preview','normal','missing','P1','Accepted evidence creates an editable proposal, never a silent update.',['Inspect attribution.','Choose Not now, then update.']],
      ['Memory','MEM-04','Brief conflict','brief-preview','brief-conflict','missing','P1','A stale brief requires refresh before a new version is saved.',['Inspect conflict warning.','Return to current brief.']],
      ['Memory','MEM-05','Achievement and consent','goal-achievement','normal','missing','P1','Only explicitly permitted reflection learning is reusable.',['Change the mood.','Edit reflection and memory permission.','Save.']],
      ['Memory','MEM-06','Reflection save failure','goal-achievement','reflection-save-error','missing','P1','Failed reflection save keeps the draft and changes no reusable memory.',['Inspect failure.','Retry with the same draft.']],

      ['Evidence','EVID-01','Thirteen gallery captures','today','normal','partial','P0','Every submitted screenshot is replaced only after its PWA state passes acceptance.',['Cross-check all 13 rows in the readiness ledger.']],
      ['Evidence','EVID-02','Final implemented-PWA video','today','normal','missing','P0','The final video shows the hosted PWA, managed agent, approval, worker, logs, and recovery.',['Replace the prototype walkthrough.','Keep disclosure accurate.']],
      ['Evidence','EVID-03','Architecture and reproducibility','settings','normal','partial','P0','Final architecture, setup, test steps, Cloud revision, and logging evidence are reproducible.',['Update architecture v0.1.','Verify README from a clean checkout.']]
    ].map((row,index)=>({group:row[0],id:row[1],title:row[2],route:row[3],edge:row[4],status:row[5],priority:row[6],requirement:row[7],steps:row[8],index}));

    const key='longview:acceptance-reviewed:v1';
    let reviewed=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
    let active=0,filter='All',query='',timer=null;
    const frame=document.querySelector('#prototype'),list=document.querySelector('#caseList'),detail=document.querySelector('#detail');
    const filters=['All','P0','P1','Implemented','Partial','Missing'];

    function filtered(){return cases.filter(item=>(filter==='All'||item.priority===filter||item.status.toLowerCase()===filter.toLowerCase())&&(`${item.id} ${item.title} ${item.group} ${item.requirement}`.toLowerCase().includes(query)));}
    function save(){localStorage.setItem(key,JSON.stringify([...reviewed]));}
    function progress(){const pct=cases.length?reviewed.size/cases.length*100:0;document.querySelector('#progressBar').style.width=`${pct}%`;document.querySelector('#progressText').textContent=`${reviewed.size} / ${cases.length} reviewed`;document.querySelector('#toggleReviewed').textContent=reviewed.has(cases[active].id)?'Mark unreviewed':'Mark reviewed';}
    function renderFilters(){document.querySelector('#filters').innerHTML=filters.map(x=>`<button class="filter ${x===filter?'on':''}" data-filter="${x}">${x}</button>`).join('');}
    function renderList(){const visible=filtered();if(!visible.length){list.innerHTML='<div class="empty">No matching acceptance cases.</div>';return}let group='';list.innerHTML=visible.map(item=>{const heading=item.group!==group?(group=item.group,`<div class="group-title">${item.group}</div>`):'';return `${heading}<button class="case ${item.index===active?'on':''}" data-index="${item.index}"><span class="num">${item.index+1}</span><span><b>${item.title}</b><small>${item.id} · ${item.priority}</small></span><span class="badges"><i class="badge ${item.status}">${item.status}</i>${reviewed.has(item.id)?'<i class="badge reviewed">✓</i>':''}</span></button>`}).join('');}
    function renderDetail(){const item=cases[active];detail.innerHTML=`<div class="meta"><span class="badge ${item.status}">${item.status}</span><span class="badge reviewed">${item.priority}</span><span class="badge reviewed">${item.id}</span></div><h1>${item.title}</h1><p>${item.group} acceptance case ${item.index+1} of ${cases.length}</p><h2>Acceptance requirement</h2><div class="requirement">${item.requirement}</div><h2>Review steps</h2><ul class="steps">${item.steps.map((step,i)=>`<li><input type="checkbox" id="step-${i}"><label for="step-${i}">${step}</label></li>`).join('')}</ul><div class="detail-actions"><button class="btn" id="previousCase">Previous</button><button class="btn" id="nextCase">Next</button><button class="btn" id="resetCase">Reset case</button><a class="btn primary" style="text-align:center;text-decoration:none" target="_blank" href="longview-pwa-interactive-mockup.html#${item.route}">Open full screen</a></div><div class="disclosure">This acceptance demo simulates product states. The badge reports current implementation status; it does not claim that mock-only behavior is shipped.</div>`;document.querySelector('#previousCase').onclick=()=>activate((active-1+cases.length)%cases.length);document.querySelector('#nextCase').onclick=()=>activate((active+1)%cases.length);document.querySelector('#resetCase').onclick=()=>loadFrame(item);}
    function loadFrame(item){frame.src=`longview-pwa-interactive-mockup.html?embed=1&acceptance=${encodeURIComponent(item.id)}#${item.route}`;frame.onload=()=>{frame.contentWindow.postMessage({type:'longview:edge',edge:item.edge},'*');};}
    function activate(index){active=index;clearInterval(timer);timer=null;renderList();renderDetail();progress();loadFrame(cases[active]);document.querySelector(`[data-index="${active}"]`)?.scrollIntoView({block:'nearest'});}
    function render(){renderFilters();renderList();renderDetail();progress();loadFrame(cases[active]);}

    document.querySelector('#filters').onclick=e=>{const button=e.target.closest('[data-filter]');if(!button)return;filter=button.dataset.filter;renderFilters();renderList();};
    document.querySelector('#search').oninput=e=>{query=e.target.value.trim().toLowerCase();renderList();};
    list.onclick=e=>{const button=e.target.closest('[data-index]');if(button)activate(Number(button.dataset.index));};
    document.querySelector('#toggleReviewed').onclick=()=>{const id=cases[active].id;reviewed.has(id)?reviewed.delete(id):reviewed.add(id);save();renderList();progress();};
    document.querySelector('#resetReview').onclick=()=>{if(confirm('Clear every reviewed checkmark?')){reviewed.clear();save();renderList();progress();}};
    document.querySelector('#runAll').onclick=()=>{clearInterval(timer);let index=active;timer=setInterval(()=>{index++;if(index>=cases.length){clearInterval(timer);timer=null;return}active=index;renderList();renderDetail();progress();loadFrame(cases[active]);},1300);};
    render();
  </script>
</body>
</html>
