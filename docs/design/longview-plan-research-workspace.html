<!doctype html>
<html lang="en" data-palette="ocean" data-mode="dark" data-font="lora" data-size="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longview Plan Research Workspace</title>
  <link rel="stylesheet" href="longview-release-prototype.css">
  <style>
    :root{--wiki:#9f8cff;--soft:color-mix(in srgb,var(--accent) 9%,var(--surface))}
    *{box-sizing:border-box}.prototype-stage{padding:24px}.device.desktop{max-width:1440px;min-height:850px}.desktop-shell{min-height:790px}
    .side{width:200px}.side-brand{margin-bottom:28px}.side-item{width:100%;border:0;text-align:left;cursor:pointer}.side-item[aria-current="page"]{background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);box-shadow:inset 3px 0 var(--accent)}
    .side-context{margin:26px 10px 0;padding-top:16px;border-top:1px solid var(--rule);color:var(--faint);font:600 9px/1.55 system-ui,sans-serif}.side-context strong{display:block;color:var(--muted);font-size:10px}
    .desktop-main{padding:34px 42px 90px}.desktop-main .screen{max-width:1060px;margin:0}.location{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:26px;padding-bottom:14px;border-bottom:1px solid var(--rule)}
    .crumb{color:var(--muted);font:600 10px/1.4 system-ui,sans-serif}.crumb b{display:block;margin-top:4px;color:var(--text);font:700 15px/1.3 system-ui,sans-serif}.location .section-pill{padding:6px 10px;border:1px solid var(--rule);border-radius:999px;color:var(--accent);font:800 9px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em}
    .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px}.page-title{max-width:760px}.page-sub{max-width:720px}.head-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.head-actions .btn{width:auto;min-width:150px;margin:0}
    .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}
    .panel{padding:18px;border:1px solid var(--rule);border-radius:14px;background:var(--surface)}.panel h2,.panel h3{margin:6px 0 8px}.panel h2{font-size:22px}.panel h3{font-size:15px}.panel p{margin:0;color:var(--muted);font:500 10px/1.58 system-ui,sans-serif}
    .metric{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.metric strong{font-size:28px}.metric span{color:var(--muted);font:700 9px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em}
    .journey{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.journey-step{padding:13px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);min-height:92px}.journey-step b{display:block;margin:6px 0 5px;font-size:13px}.journey-step p{color:var(--muted);font:500 9px/1.45 system-ui,sans-serif}
    .toolbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.segmented{display:flex;gap:4px;padding:4px;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}.segmented button{padding:8px 11px;border:0;border-radius:7px;background:transparent;color:var(--muted);font:700 9px/1 system-ui,sans-serif;cursor:pointer}.segmented button.on{background:var(--accent);color:#07131b}
    .research-list{display:grid;gap:10px}.source-card{padding:15px;border:1px solid var(--rule);border-radius:12px;background:var(--surface);cursor:pointer}.source-card:hover{border-color:var(--accent)}.source-top{display:flex;justify-content:space-between;gap:12px}.source-card h3{margin:7px 0 6px;font-size:16px}.source-card p{margin:0;color:var(--muted);font:500 9px/1.5 system-ui,sans-serif}.source-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);font:700 8px/1 system-ui,sans-serif}.chip.accent{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule));color:var(--accent)}.chip.wiki{color:var(--wiki)}
    .board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:10px;overflow-x:auto}.board-col{padding:12px;border:1px solid var(--rule);border-radius:12px;background:color-mix(in srgb,var(--surface) 75%,transparent);min-height:340px}.board-title{display:flex;justify-content:space-between;margin-bottom:10px;color:var(--text);font:800 10px/1 system-ui,sans-serif}.board-card{margin-bottom:9px;padding:11px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);cursor:pointer}.board-card b{display:block;font-size:12px;line-height:1.35}.board-card small{display:block;margin-top:7px;color:var(--muted);font:600 8px/1.4 system-ui,sans-serif}
    .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:6px;color:var(--muted);font:800 9px/1 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em}.input{width:100%;min-height:42px;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);color:var(--text);font:500 11px/1.5 system-ui,sans-serif}.field textarea.input{min-height:80px;resize:vertical}
    .choice{display:flex;align-items:flex-start;gap:10px;padding:13px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);cursor:pointer}.choice+.choice{margin-top:9px}.choice.selected{border-color:var(--accent);background:var(--soft)}.choice input{margin-top:3px;accent-color:var(--accent)}.choice-copy{flex:1}.choice-copy b{display:block;font-size:14px}.choice-copy span{display:block;margin-top:4px;color:var(--muted);font:500 9px/1.45 system-ui,sans-serif}.choice-score{color:var(--accent);font:800 9px/1 system-ui,sans-serif}
    .notice{margin:12px 0}.notice strong{font-size:12px}.notice span{font-size:9px}.review-table{width:100%;border-collapse:collapse}.review-table th,.review-table td{padding:10px 8px;border-bottom:1px solid var(--rule);text-align:left;font:600 9px/1.4 system-ui,sans-serif}.review-table th{color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.review-table td{color:var(--text)}
    .wiki-layout{display:grid;grid-template-columns:250px 1fr;gap:14px}.wiki-nav,.wiki-page{padding:16px;border:1px solid var(--rule);border-radius:13px;background:var(--surface)}.wiki-nav button{display:block;width:100%;margin:4px 0;padding:10px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font:700 9px/1.3 system-ui,sans-serif;cursor:pointer}.wiki-nav button.on{background:var(--soft);color:var(--accent)}.wiki-page h2{font-size:25px}.wiki-page h3{margin:22px 0 8px;font-size:16px}.wiki-page p{color:var(--muted);font:500 11px/1.7 system-ui,sans-serif}.citation{display:inline-flex;margin-left:3px;padding:2px 5px;border-radius:5px;background:color-mix(in srgb,var(--wiki) 18%,transparent);color:var(--wiki);font:800 8px/1 system-ui,sans-serif;cursor:pointer}
    .clara-box{padding:18px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--rule));border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--surface)),var(--surface))}.clara-box h2{margin:6px 0 8px}.clara-wait{max-width:none}.clara-progress{max-width:none}.clara-mark{background:var(--accent);color:#06131b}
    .action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.action-row .btn{width:auto;min-width:150px;margin:0}.danger{border-color:var(--amber)}.empty-state{text-align:center;padding:54px 22px}.empty-state h2{font-size:25px}.empty-state p{max-width:500px;margin:0 auto 18px;color:var(--muted);font:500 10px/1.6 system-ui,sans-serif}
    .mobile-shell{display:none;height:730px}.mobile-shell .viewport{height:730px;min-height:0;overflow-y:auto;padding-bottom:86px}.mobile-shell .screen{padding:22px 18px}.mobile-shell .page-head{display:block}.mobile-shell .head-actions{justify-content:flex-start;margin-top:14px}.mobile-shell .grid{display:block}.mobile-shell .panel{margin-bottom:12px}.mobile-shell .journey{grid-template-columns:1fr 1fr}.mobile-shell .board{grid-template-columns:repeat(4,220px)}.mobile-shell .wiki-layout{display:block}.mobile-shell .wiki-nav{margin-bottom:12px}.mobile-shell .field-grid{display:block}.mobile-shell .field{margin-bottom:12px}.mobile-shell .toolbar-row{align-items:flex-start;flex-direction:column}.mobile-shell .segmented{overflow:auto;max-width:100%}
    body[data-platform="mobile"] .desktop-shell{display:none}body[data-platform="mobile"] .mobile-shell{display:block}body[data-platform="mobile"] .device.phone{height:780px;min-height:780px}.mobile-shell .bottom-item[aria-current="page"]{background:var(--accent);color:#06131b}
    @media(max-width:900px){.span-8,.span-7,.span-6,.span-5,.span-4{grid-column:1/-1}.journey{grid-template-columns:1fr 1fr}.board{grid-template-columns:repeat(4,220px)}}
  </style>
</head>
<body data-platform="desktop"><main id="prototype" aria-live="polite"></main>
<script>
(() => {
  const screens={home:'Workspace overview',capture:'Add a source',matching:'Clara matching',recommendation:'Review Plan association',review:'Review before saving',saved:'Source saved',library:'Research library',board:'Research board',detail:'Source details',unassigned:'Unassigned research',wiki:'Plan Wiki',wikiEdit:'Edit cited page',wikiReview:'Review wiki revision',brief:'Promote to Plan Brief',failure:'Failure and recovery'};
  const scenarios={success:'Clear Plan match',invalid:'Invalid or private URL',ambiguous:'Ambiguous match',multi:'Useful across multiple Plans',duplicate:'Duplicate URL',noMatch:'No matching Plan',claraUnavailable:'Clara unavailable',offline:'Save unavailable offline',stale:'Wiki changed elsewhere'};
  const seeded={url:'https://example.com/early-user-onboarding-study',title:'Why early users need a visible first success',excerpt:'Teams were more likely to continue when the first useful outcome appeared during the initial session.',note:'This may help shape the first-value checkpoint before inviting more users.',topic:'Early user activation'};
  const state={screen:'home',scenario:'success',platform:'desktop',source:{...seeded},selectedPlans:['launch'],saved:false,wikiDraft:'A visible first success should happen before expansion. Early evidence suggests users continue when the initial outcome is concrete and observable.'};
  const root=document.getElementById('prototype');
  const esc=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
  const action=(label,name,cls='')=>`<button class="btn ${cls}" data-action="${name}">${label}</button>`;
  const chip=(label,cls='')=>`<span class="chip ${cls}">${label}</span>`;
  const location=()=>`<header class="location"><div class="crumb">Plans / Launch Longview / Research<b>${screens[state.screen]}</b></div><span class="section-pill">Plans</span></header>`;
  const pageHead=(title,copy,actions='')=>`<div class="page-head"><div><h1 class="page-title">${title}</h1><p class="page-sub">${copy}</p></div>${actions?`<div class="head-actions">${actions}</div>`:''}</div>`;
  const sourceCard=(title=seeded.title,status='Useful')=>`<article class="source-card" data-go="detail"><div class="source-top">${chip(status,status==='Useful'?'accent':'')}<span class="meta">Saved by you</span></div><h3>${title}</h3><p>${state.source.note}</p><div class="source-meta">${chip('Early user activation')}${chip('Launch Longview','accent')}${chip('1 cited statement','wiki')}</div></article>`;
  const notice=(title,copy,kind='blue')=>`<div class="notice"><span class="badge ${kind}">${kind==='rose'?'Safe stop':kind==='green'?'Confirmed':kind==='amber'?'Needs a choice':'Review first'}</span><div><strong>${title}</strong><span>${copy}</span></div></div>`;
  const progress=()=>`<div class="clara-box"><div class="clara-wait"><div class="clara-mark">C</div><h2>Clara is comparing this source with your active Plans…</h2><p>Only the title, excerpt, your note, and Plan summaries are used. Nothing is linked or saved while this runs.</p><div class="clara-progress" role="progressbar" aria-label="Comparing source with Plans"><span></span></div></div></div>`;
  const planChoice=(id,title,copy,score,checked=false)=>`<label class="choice ${checked?'selected':''}"><input type="checkbox" data-plan="${id}" ${checked?'checked':''}><span class="choice-copy"><b>${title}</b><span>${copy}</span></span><span class="choice-score">${score}</span></label>`;
  const nav=()=>`<aside class="side"><div class="side-brand">Longview</div><nav aria-label="Primary"><button class="side-item" data-go="home"><i class="nav-glyph">●</i>Today</button><button class="side-item"><i class="nav-glyph">□</i>Calendar</button><button class="side-item" data-go="home" aria-current="page"><i class="nav-glyph">◇</i>Plans</button><button class="side-item"><i class="nav-glyph">⚙</i>Settings</button></nav><div class="side-context"><strong>Current Plan</strong>Launch Longview<br><br><strong>Research</strong>User-directed evidence</div></aside>`;
  const bottomNav=()=>`<nav class="bottom-nav"><button class="bottom-item">Today</button><button class="bottom-item">Calendar</button><button class="bottom-item" aria-current="page" data-go="home">Plans</button><button class="bottom-item">Settings</button></nav>`;
  const views={
    home:()=>`${pageHead('Build understanding before changing the Plan.','Collect your own sources, organize what matters, and turn cited conclusions into deliberate Plan decisions.',btn('Add a source','capture','primary')+btn('Open Plan Wiki','wiki'))}<div class="grid"><section class="panel span-8"><span class="section-label">Research flow</span><div class="journey"><div class="journey-step">${chip('1','accent')}<b>Capture</b><p>Add a URL, excerpt and why it matters.</p></div><div class="journey-step">${chip('2','accent')}<b>Associate</b><p>You confirm which Plans it supports.</p></div><div class="journey-step">${chip('3','accent')}<b>Synthesize</b><p>Write cited conclusions in the Plan Wiki.</p></div><div class="journey-step">${chip('4','accent')}<b>Promote</b><p>Review selected conclusions in the Plan Brief.</p></div></div></section><section class="panel span-4"><div class="metric"><strong>8</strong><span>Saved sources</span></div><div class="metric"><strong>3</strong><span>Useful</span></div><div class="metric"><strong>2</strong><span>Wiki pages</span></div></section><section class="panel span-7"><span class="section-label">Continue research</span><h2>Early user activation</h2><p>What must a new user experience before they believe the Plan is working?</p><div class="action-row">${btn('Review inbox','library','primary')}${btn('Open board','board')}</div></section><section class="panel span-5"><span class="section-label">Clara’s role</span><h2>Suggest, never decide.</h2><p>Clara can recommend Plan links, find duplicate ideas, or point out conflicts. You approve every association and every saved synthesis.</p></section></div>`,
    capture:()=>`${pageHead('Add a source','Capture enough context to remember why this matters. Full-page crawling is not part of this first release.')}<section class="panel"><div class="field-grid"><div class="field full"><label for="url">Source URL</label><input id="url" class="input" value="${esc(state.scenario==='invalid'?'http://localhost/private':state.source.url)}"></div><div class="field full"><label for="title">Title</label><input id="title" class="input" value="${esc(state.source.title)}"></div><div class="field full"><label for="excerpt">Useful excerpt</label><textarea id="excerpt" class="input">${esc(state.source.excerpt)}</textarea></div><div class="field"><label for="topic">Topic or question</label><input id="topic" class="input" value="${esc(state.source.topic)}"></div><div class="field"><label for="note">Why it matters</label><textarea id="note" class="input">${esc(state.source.note)}</textarea></div></div>${state.scenario==='invalid'?notice('Use a public HTTPS URL.','Private, local, signed, or malformed addresses are not saved. Correct the URL or cancel.','rose'):notice('Nothing is saved yet.','You can ask Clara to suggest a Plan, select Plans yourself, or keep this unassigned.')}<div class="action-row">${action('Ask Clara to suggest Plans','start-match','primary')}${btn('Choose Plans myself','recommendation')}${btn('Cancel','home','ghost')}</div></section>`,
    matching:()=>`${pageHead('Finding the right context','Clara is read-only during matching.')}${progress()}<div class="action-row">${action('Show recommendation','match-result','primary')}${action('Cancel matching','cancel-match','ghost')}</div>`,
    recommendation:()=>{if(state.scenario==='duplicate')return `${pageHead('This source is already in your library.','Avoid splitting notes and citations across duplicate cards.')}${notice('Existing source found.','Saved 18th August 2026 · linked to Launch Longview · currently Useful.','amber')}${sourceCard()}<div class="action-row">${action('Link the existing source','use-existing','primary')}${btn('Open existing source','detail')}${btn('Cancel','home','ghost')}</div>`;if(state.scenario==='claraUnavailable')return `${pageHead('Choose where this source belongs.','Clara is unavailable, but manual organization still works.')}${notice('Plan suggestions are temporarily unavailable.','Your source details remain on this device. Nothing was saved.','rose')}${planChoice('launch','Launch Longview','Release the complete planning flow to early users.','Choose',state.selectedPlans.includes('launch'))}${planChoice('research','Improve research workflow','Make user-led research easier to collect and synthesize.','Choose',state.selectedPlans.includes('research'))}<div class="action-row">${btn('Review association','review','primary')}${action('Keep unassigned','keep-unassigned')}${btn('Try Clara again','matching','ghost')}</div>`;const ambiguous=state.scenario==='ambiguous';const noMatch=state.scenario==='noMatch';const multi=state.scenario==='multi';return `${pageHead(noMatch?'No confident Plan match':'Review Clara’s suggestion','A recommendation is not an association. You make the final choice.')}${notice(noMatch?'This may not belong to an active Plan.':ambiguous?'Two Plans look equally relevant.':multi?'This source may support two Plans.':'Launch Longview is the strongest match.',noMatch?'Keep it unassigned or choose manually.':ambiguous?'Clara needs your context before linking it.':multi?'Select both only if each association will remain useful.':'The source discusses an observable first success before expansion.',noMatch?'amber':ambiguous?'amber':'blue')}<div class="clara-box"><span class="section-label">Clara recommendation</span>${planChoice('launch','Launch Longview','Release the complete planning flow to early users.',noMatch?'Low':ambiguous?'62%':'91%',state.selectedPlans.includes('launch'))}${planChoice('research','Improve research workflow','Help users collect and synthesize their own evidence.',noMatch?'Low':ambiguous?'59%':multi?'84%':'38%',state.selectedPlans.includes('research'))}${planChoice('learning','Build an applied AI learning path','Turn practice into evidence of capability.','18%',state.selectedPlans.includes('learning'))}</div><div class="action-row">${btn('Review association','review','primary')}${action('Keep unassigned','keep-unassigned')}${btn('Back to source','capture','ghost')}</div>`},
    review:()=>`${pageHead('Review before saving','Confirm the exact source, note, topic, and Plan links.')}<section class="panel"><table class="review-table"><tr><th>Source</th><td>${esc(state.source.title)}</td></tr><tr><th>Topic</th><td>${esc(state.source.topic)}</td></tr><tr><th>Your note</th><td>${esc(state.source.note)}</td></tr><tr><th>Plan links</th><td>${state.selectedPlans.length?state.selectedPlans.map(id=>id==='launch'?'Launch Longview':id==='research'?'Improve research workflow':'Applied AI learning path').join(', '):'Unassigned research'}</td></tr><tr><th>Clara</th><td>Recommendation only · cannot save this source</td></tr></table></section>${notice('This creates one source and explicit Plan links.','It does not update the Plan Wiki or Plan Brief.')}<div class="action-row">${action('Save source','save-source','primary')}${btn('Change Plans','recommendation')}${btn('Cancel','home','ghost')}</div>`,
    saved:()=>`${pageHead('Source saved.','It is now available in your library and linked only to the Plans you confirmed.')} ${notice(state.selectedPlans.length?'Association confirmed.':'Kept in Unassigned research.',state.selectedPlans.length?'Launch Longview can now use this source in its Research workspace.':'No Plan was changed. You can associate it later.','green')}<section class="panel">${sourceCard(state.source.title,'Inbox')}</section><div class="action-row">${btn('Open research library','library','primary')}${btn('Add another source','capture')}${btn('Back to Plan','home','ghost')}</div>`,
    library:()=>`${pageHead('Research library','Sources are stored once. Plan links, topics and workflow states remain visible.',btn('Add a source','capture','primary')+btn('Unassigned','unassigned'))}<div class="toolbar-row"><div class="segmented"><button class="on">All 8</button><button>Launch Longview 6</button><button>Useful 3</button><button>Archived 1</button></div><span class="meta">Search by title, URL, note or topic</span></div><div class="research-list">${sourceCard()}${sourceCard('Activation checklists reduce uncertainty','Reading')}${sourceCard('Five interview prompts for first-value discovery','Inbox')}</div><div class="action-row">${btn('Organize on board','board','primary')}${btn('Open Plan Wiki','wiki')}</div>`,
    board:()=>`${pageHead('Research board','Move sources through your own workflow. Card movement never changes a Plan or wiki.')}<div class="board"><section class="board-col"><div class="board-title"><span>Inbox</span><span>2</span></div><article class="board-card" data-go="detail"><b>Five interview prompts for first-value discovery</b><small>Customer research · Launch Longview</small></article><article class="board-card"><b>New user onboarding benchmarks</b><small>Unassigned</small></article></section><section class="board-col"><div class="board-title"><span>Reading</span><span>2</span></div><article class="board-card"><b>Activation checklists reduce uncertainty</b><small>Early user activation</small></article></section><section class="board-col"><div class="board-title"><span>Useful</span><span>3</span></div><article class="board-card" data-go="detail"><b>${seeded.title}</b><small>1 cited statement · 2 Plan links</small></article></section><section class="board-col"><div class="board-title"><span>Archived</span><span>1</span></div><article class="board-card"><b>Generic growth tactics list</b><small>Archived by you</small></article></section></div><div class="action-row">${btn('Back to library','library','primary')}${btn('Open Plan Wiki','wiki')}</div>`,
    detail:()=>`${pageHead('Source details','Raw evidence, your interpretation, and every association stay distinguishable.')}<div class="grid"><section class="panel span-7"><span class="badge green">Useful</span><h2>${esc(state.source.title)}</h2><p>${esc(state.source.excerpt)}</p><div class="source-meta">${chip(state.source.topic)}${chip('Captured by you')}${chip('21st August 2026')}</div><h3>Why it matters</h3><p>${esc(state.source.note)}</p><div class="action-row">${btn('Open original URL','detail')}${btn('Edit note','capture')}</div></section><aside class="panel span-5"><span class="section-label">Associated Plans</span><h3>Launch Longview</h3><p>Confirmed by you · Clara suggested this match.</p><h3>Improve research workflow</h3><p>Confirmed by you · linked after review.</p><div class="action-row">${btn('Review Plan links','recommendation','primary')}</div><span class="section-label">Used in the wiki</span><p>Early user activation / First-value checkpoint · statement 2</p></aside></div><div class="action-row">${btn('Back to library','library','primary')}${btn('Use in Plan Wiki','wiki')}</div>`,
    unassigned:()=>`${pageHead('Unassigned research','Useful material can wait here until its Plan context is clear.',btn('Add a source','capture','primary'))}<section class="empty-state panel"><span class="badge amber">2 sources</span><h2>Nothing is lost and no Plan is guessed.</h2><p>Review these sources when a new Plan is created or when their intended use becomes clearer.</p>${sourceCard('New user onboarding benchmarks','Unassigned')}${btn('Review possible Plans','recommendation','primary')}</section>`,
    wiki:()=>`${pageHead('Plan Wiki','Your evolving understanding, written by you and backed by sources.',btn('Edit this page','wikiEdit','primary')+btn('Promote conclusions','brief'))}<div class="wiki-layout"><nav class="wiki-nav" aria-label="Wiki pages"><span class="section-label">Pages</span><button class="on">Early user activation</button><button>Research questions</button><button>Onboarding experiments</button><button>Contradictions</button><button>Decision log</button></nav><article class="wiki-page"><span class="badge violet">Version 3 · cited</span><h2>Early user activation</h2><p>The first session should produce one observable result before the user is asked to expand their setup.<button class="citation" data-go="detail">[1]</button></p><h3>What current evidence suggests</h3><p>Users continue when the initial outcome is concrete and visible. A short checklist may reduce uncertainty, but it should follow the first useful result rather than precede it.<button class="citation">[2]</button></p><h3>Open question</h3><p>Which result is meaningful enough to count as first value for different Plan types?</p><div class="source-meta">${chip('2 cited sources','wiki')}${chip('1 open question')}${chip('Saved by you')}</div></article></div>`,
    wikiEdit:()=>`${pageHead('Edit cited wiki page','Clara may help compare selected sources, but the synthesis remains your draft.')}<div class="grid"><section class="panel span-8"><div class="field"><label for="wiki-title">Page title</label><input id="wiki-title" class="input" value="Early user activation"></div><div class="field"><label for="wiki-body">Your synthesis</label><textarea id="wiki-body" class="input" style="min-height:240px">${esc(state.wikiDraft)}</textarea></div></section><aside class="panel span-4"><span class="section-label">Available citations</span>${sourceCard()}<div class="action-row">${action('Insert citation [1]','insert-citation','primary')}</div></aside></div><div class="action-row">${action('Review wiki revision','review-wiki','primary')}${btn('Cancel','wiki','ghost')}</div>`,
    wikiReview:()=>state.scenario==='stale'?`${pageHead('This wiki page changed elsewhere.','Your draft was not written over the newer version.')}${notice('Version 4 is already current.','Review the latest text and citations before applying your draft again.','rose')}<div class="action-row">${btn('Review current page','wiki','primary')}${btn('Return to draft','wikiEdit')}</div>`:`${pageHead('Review wiki version 4','Confirm the exact synthesis and its statement-level citations.')}<section class="wiki-page"><span class="badge violet">Proposed version 4</span><h2>Early user activation</h2><p>${esc(state.wikiDraft)}<button class="citation" data-go="detail">[1]</button></p><div class="source-meta">${chip('Source [1] · '+seeded.title,'wiki')}</div></section>${notice('The current wiki page is still version 3.','Saving creates one immutable version. It does not update the Plan Brief.')}<div class="action-row">${action('Save wiki version 4','save-wiki','primary')}${btn('Edit draft','wikiEdit')}${btn('Cancel','wiki','ghost')}</div>`,
    brief:()=>`${pageHead('Promote conclusions to the Plan Brief','Choose only the conclusions that should guide execution. The wiki remains broader.')}<section class="panel"><label class="choice selected"><input type="checkbox" checked><span class="choice-copy"><b>Make first value observable before expanding onboarding.</b><span>From Plan Wiki / Early user activation / version 3 · sources [1] and [2]</span></span></label><label class="choice"><input type="checkbox"><span class="choice-copy"><b>Test whether a short checklist reduces uncertainty.</b><span>Open hypothesis · source [2]</span></span></label></section>${notice('This prepares a proposal only.','The existing Plan Brief remains unchanged until its exact preview is approved.')}<div class="action-row">${btn('Prepare Plan Brief proposal','home','primary')}${btn('Back to wiki','wiki','ghost')}</div>`,
    failure:()=>`${pageHead('Your research is safe.','The requested operation stopped before changing confirmed work.')}${notice(state.scenario==='offline'?'This source could not be saved.':'Clara could not compare this source.',state.scenario==='offline'?'Your completed review remains on this screen. Retry when the connection returns.':'Choose Plans manually or retry matching later.','rose')}<div class="action-row">${state.scenario==='offline'?btn('Retry save','review','primary'):btn('Choose Plans manually','recommendation','primary')}${btn('Return to workspace','home','ghost')}</div>`
  };
  function syncCapture(){const ids=['url','title','excerpt','note','topic'];for(const id of ids){const el=document.getElementById(id);if(el)state.source[id]=el.value}}
  function applyScenarioDefaults(value){state.scenario=value;state.selectedPlans=value==='multi'?['launch','research']:value==='success'||value==='duplicate'?['launch']:[]}
  function render(){const screen=views[state.screen]||views.home;const bar=`<header class="demo-bar"><div class="demo-identity"><span class="demo-brand">Longview</span><span class="demo-tag">Plan Research Workspace · concept review</span></div><div class="demo-menus"><select id="platform" aria-label="Platform"><option value="desktop" ${state.platform==='desktop'?'selected':''}>Desktop</option><option value="mobile" ${state.platform==='mobile'?'selected':''}>Mobile</option></select><select id="screen" aria-label="Screen">${Object.entries(screens).map(([id,label])=>`<option value="${id}" ${state.screen===id?'selected':''}>${label}</option>`).join('')}</select><select id="scenario" aria-label="Scenario">${Object.entries(scenarios).map(([id,label])=>`<option value="${id}" ${state.scenario===id?'selected':''}>${label}</option>`).join('')}</select></div><button class="demo-reset" data-action="reset">Reset</button></header>`;const content=`${location()}${screen()}`;const shell=state.platform==='desktop'?`<div class="desktop-shell">${nav()}<main class="desktop-main"><section class="screen">${content}</section></main></div>`:`<div class="mobile-shell"><main class="viewport"><section class="screen">${content}</section></main>${bottomNav()}</div>`;const deviceClass=state.platform==='desktop'?'device desktop web':'device phone mweb';root.innerHTML=`<div class="prototype-page">${bar}<div class="prototype-stage"><section class="${deviceClass}"><div class="browser-chrome"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span class="address">Local concept review · no production writes</span></div>${shell}</section></div></div>`;document.body.dataset.platform=state.platform;document.getElementById('platform').onchange=e=>{state.platform=e.target.value;render()};document.getElementById('screen').onchange=e=>{state.screen=e.target.value;render()};document.getElementById('scenario').onchange=e=>{applyScenarioDefaults(e.target.value);render()}}
  root.addEventListener('change',event=>{const input=event.target.closest('[data-plan]');if(!input)return;const id=input.dataset.plan;if(input.checked&&!state.selectedPlans.includes(id))state.selectedPlans.push(id);if(!input.checked)state.selectedPlans=state.selectedPlans.filter(value=>value!==id);render()});
  root.addEventListener('click',event=>{const target=event.target.closest('[data-go],[data-action]');if(!target)return;if(target.dataset.go){syncCapture();state.screen=target.dataset.go;render();return}const actionName=target.dataset.action;if(actionName==='reset'){Object.assign(state,{screen:'home',scenario:'success',platform:'desktop',source:{...seeded},selectedPlans:['launch'],saved:false,wikiDraft:'A visible first success should happen before expansion. Early evidence suggests users continue when the initial outcome is concrete and observable.'})}if(actionName==='start-match'){syncCapture();state.screen='matching'}if(actionName==='cancel-match')state.screen='capture';if(actionName==='match-result')state.screen=['claraUnavailable'].includes(state.scenario)?'recommendation':'recommendation';if(actionName==='keep-unassigned'){state.selectedPlans=[];state.screen='review'}if(actionName==='use-existing')state.screen='detail';if(actionName==='save-source'){state.screen=state.scenario==='offline'?'failure':'saved';state.saved=state.scenario!=='offline'}if(actionName==='insert-citation'){const text=document.getElementById('wiki-body');if(text&&!text.value.includes('[1]'))text.value+=' [1]';return}if(actionName==='review-wiki'){const text=document.getElementById('wiki-body');if(text)state.wikiDraft=text.value;state.screen='wikiReview'}if(actionName==='save-wiki')state.screen='wiki';render()});
  render();
})();
</script></body></html>
