<!doctype html>
<html lang="en" data-palette="ocean" data-mode="dark" data-font="lora" data-size="default">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longview Release 5 reviewed research and Plan Brief</title>
  <link rel="stylesheet" href="longview-release-prototype.css">
</head>
<body data-platform="mweb"><main id="prototype" aria-live="polite"></main>
<script>
(() => {
  const screens={hub:'Research and Brief',researchLoading:'Research loading',researchCards:'Research cards',cardDetail:'Evidence detail',reviewSaving:'Saving review',proposalLoading:'Preparing proposal',proposalEdit:'Edit Plan Brief',proposalReview:'Review Plan Brief',briefSaving:'Saving Plan Brief',briefCurrent:'Current Plan Brief',history:'Version history',failure:'Failure and recovery'};
  const scenarios={success:'Successful journey',cancelResearch:'Research cancelled',timeout:'Research timeout',malformed:'Malformed research',offlineResearch:'Research unavailable offline',missingAttribution:'Missing attribution',reviewOffline:'Review write unavailable',reviewConcurrent:'Concurrent card review',reviewDuplicate:'Duplicate review retry',reviewPartial:'Review response lost',deferProposal:'Plan Brief deferred',briefOffline:'Brief save unavailable',briefStale:'Stale brief edit',briefConcurrent:'Concurrent brief save',briefDuplicate:'Duplicate brief retry',briefPartial:'Brief response lost',researchRead:'Saved research unavailable',briefRead:'Current brief unavailable'};
  const defaults={title:'Prove repeatable first value',approach:'Guide three design partners to a visible first success before expanding onboarding.',proof:'Three partners complete the first-value checkpoint without live intervention.'};
  const state={screen:'hub',scenario:'success',decision:'pending',operation:'research',draft:{...defaults}}; const root=document.getElementById('prototype');
  const esc=value=>value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
  const action=(label,name,cls='')=>`<button class="btn ${cls}" data-action="${name}">${label}</button>`;
  const top=(title,copy='')=>`<div class="topline"><strong>Longview</strong><span class="badge violet">Release 5 · Research + Brief</span></div><h1 class="page-title">${title}</h1>${copy?`<p class="page-sub">${copy}</p>`:''}`;
  const notice=(title,copy,kind='blue')=>`<div class="notice"><span class="badge ${kind}">${kind==='rose'?'Safe stop':kind==='green'?'Confirmed':'Review first'}</span><div><strong>${title}</strong><span>${copy}</span></div></div>`;
  const progress=label=>`<div class="clara-wait"><div class="clara-mark">L</div><h2>${label}</h2><p>Your saved research and current Plan Brief remain unchanged while this finishes.</p><div class="clara-progress" role="progressbar" aria-label="${label}"><span></span></div></div>`;
  const attribution=(compact=false)=>`<div class="research-source"><span>Customer interview notes · Partner 02</span><span>18 Aug 2026</span></div>${compact?'':`<p class="meta">Evidence ID interview-partner-02-0818 · observed 18th August 2026 · added 19th August 2026</p>`}`;
  const card=(status='Pending review')=>`<div class="card research"><span class="badge ${status==='Accepted'?'green':status==='Rejected'?'rose':status==='Not now'?'amber':'violet'}">${status}</span><h2 class="card-title">Users need a visible first success before inviting teammates.</h2><p class="card-copy">Two of three design partners completed setup only after the first-value checkpoint was made explicit.</p>${attribution(true)}</div>`;
  const reviewRecovery=()=>state.scenario==='reviewDuplicate'?notice('Review already saved once.','The original matching decision was returned; no duplicate event was added.','green'):state.scenario==='reviewPartial'?notice('Review restored after an interrupted response.','The original request key found the confirmed decision.','green'):'';
  const failureValues={
    cancelResearch:['Research stopped.','No new cards were added. Saved research and the current Plan Brief are unchanged.','Return to saved research'],
    timeout:['Research took too long.','The request stopped safely. Saved cards and the current Plan Brief are still available.','Try research again'],
    malformed:['This research could not be used.','The response did not match the required evidence format. Nothing was saved.','Try research again'],
    offlineResearch:['You appear to be offline.','Saved cards and the current Plan Brief remain available. No new research was saved.','Retry research'],
    missingAttribution:['One result had no trustworthy source.','Longview excluded that card. The attributed results remain ready for review.','Review valid cards'],
    reviewOffline:['This review was not confirmed.','The card keeps its last confirmed state and your choice remains available to retry.','Retry review'],
    reviewConcurrent:['This card changed in another tab.','Longview loaded the latest confirmed review instead of replacing it.','Review latest card'],
    reviewPartial:['The confirmation was interrupted.','Longview found the original review and restored it without adding another event.','View restored review'],
    briefOffline:['This Plan Brief was not confirmed.','Your edited proposal remains on this screen. The current brief is unchanged.','Retry save'],
    briefStale:['A newer Plan Brief already exists.','Your edits were not saved over it. Review version 3 before applying your changes again.','View current version'],
    briefConcurrent:['Another tab saved this Plan Brief first.','Longview kept version 3 and did not create a conflicting version.','View current version'],
    researchRead:['Saved research is temporarily unavailable.','The current Plan Brief is still available. No stale cards are shown.','Retry research cards'],
    briefRead:['The current Plan Brief is temporarily unavailable.','Saved research remains available. No stale brief is shown.','Retry current brief']
  };
  const failure=()=>{const v=failureValues[state.scenario]||failureValues.reviewOffline;const target=['cancelResearch','timeout','malformed','offlineResearch'].includes(state.scenario)?'researchLoading':state.scenario==='missingAttribution'||state.scenario==='researchRead'||state.scenario==='reviewConcurrent'||state.scenario==='reviewPartial'?'researchCards':state.scenario==='briefRead'||['briefStale','briefConcurrent'].includes(state.scenario)?'briefCurrent':state.operation==='brief'?'briefSaving':'reviewSaving';return `${notice(v[0],v[1],'rose')}${btn(v[2],target,'primary')}${btn('Return without changes','hub','ghost')}`};
  const views={
    hub:()=>`<section class="screen">${top('Research and Plan Brief','Turn evidence into a brief only after you review every change.')}<div class="card"><span class="section-label">Build SaaS Startup</span><h2 class="card-title">Validate customer activation</h2><p class="card-copy">3 saved research cards · 1 accepted · Plan Brief version 2</p></div>${notice('Opening this page changes nothing.','Saved research and Plan Brief versions load independently.')}<div class="row">${btn('Review research','researchCards','primary')}${btn('Current Plan Brief','briefCurrent')}</div>${btn('Find new research','researchLoading','ghost')}</section>`,
    researchLoading:()=>`<section class="screen">${top('Finding evidence for this Plan…','The request uses this Plan outcome, current step, and accepted research only.')}${progress('Finding attributed research…')}${action('Show result','research-result','primary')}${action('Cancel research','cancel-research','ghost')}</section>`,
    researchCards:()=>state.scenario==='researchRead'?`<section class="screen">${top('Saved research unavailable.')}${failure()}</section>`:`<section class="screen">${top('Research cards','Each finding keeps its source and your latest review.')}<div data-card="primary">${card(state.decision==='pending'?'Pending review':state.decision==='accept'?'Accepted':state.decision==='reject'?'Rejected':'Not now')}</div><div class="row">${action('Accept','accept','primary')}${action('Reject','reject')}${action('Not now','defer','ghost')}</div>${reviewRecovery()}<div class="card research"><span class="badge amber">Not now</span><h2 class="card-title">A shorter setup checklist may reduce abandonment.</h2><p class="card-copy">Available when you want to reconsider it.</p><div class="research-source"><span>Activation funnel export</span><span>17 Aug 2026</span></div></div>${btn('Inspect source details','cardDetail')}${btn('Prepare Plan Brief','proposalLoading','primary')}${btn('Back to Plan','hub','ghost')}</section>`,
    cardDetail:()=>`<section class="screen">${top('Evidence and source','Attribution stays attached even after rejection or deferral.')}${card(state.decision==='pending'?'Pending review':state.decision==='accept'?'Accepted':state.decision==='reject'?'Rejected':'Not now')}<div class="card"><span class="section-label">Evidence excerpt</span><p class="card-copy">“Once we saw the first successful import, the remaining setup felt worth finishing.”</p>${attribution()}<p class="meta">Source locator: workspace/interviews/partner-02 · captured by the Plan owner</p></div>${btn('Back to research','researchCards','primary')}</section>`,
    reviewSaving:()=>`<section class="screen">${top('Saving your research review…','The evidence and its current revision are checked together.')}${progress('Saving one review decision…')}${action('Show result','review-result','primary')}</section>`,
    proposalLoading:()=>`<section class="screen">${top('Preparing a Plan Brief proposal…','Only accepted evidence can shape the draft.')}${progress('Drafting from accepted evidence…')}${action('Show proposal','proposal-result','primary')}${action('Cancel proposal','defer-proposal','ghost')}</section>`,
    proposalEdit:()=>`<section class="screen">${top('Edit the Plan Brief proposal','This draft is not a saved Plan Brief version.')}<div class="field"><label for="brief-title">Focus</label><input id="brief-title" class="input" value="${esc(state.draft.title)}"></div><div class="field"><label for="brief-approach">Approach</label><textarea id="brief-approach" class="input">${esc(state.draft.approach)}</textarea></div><div class="field"><label for="brief-proof">Success evidence</label><textarea id="brief-proof" class="input">${esc(state.draft.proof)}</textarea></div><div class="card research"><span class="section-label">Evidence attribution</span><p class="card-copy">Users need a visible first success before inviting teammates.</p>${attribution(true)}</div>${action('Review Plan Brief','review-proposal','primary')}${action('Not now','defer-proposal','ghost')}</section>`,
    proposalReview:()=>`<section class="screen">${top('Review Plan Brief version 3','Confirm the exact text and evidence before saving.')}<div class="card"><span class="badge violet">Proposed version 3</span><h2 class="card-title">${esc(state.draft.title)}</h2><p class="card-copy"><strong>Approach:</strong> ${esc(state.draft.approach)}</p><p class="card-copy"><strong>Success evidence:</strong> ${esc(state.draft.proof)}</p><p class="meta">Based on 1 accepted research card · expected current version 2</p></div>${notice('Nothing has been saved.','The current version remains available until this exact proposal is confirmed.')} ${action('Save version 3','save-brief','primary')}${btn('Edit proposal','proposalEdit')}${action('Cancel without saving','defer-proposal','ghost')}</section>`,
    briefSaving:()=>`<section class="screen">${top('Saving Plan Brief version 3…','Checking the current version, evidence, and original request key.')}${progress('Saving one Plan Brief version…')}${action('Show result','brief-result','primary')}</section>`,
    briefCurrent:()=>state.scenario==='briefRead'?`<section class="screen">${top('Current Plan Brief unavailable.')}${failure()}</section>`:`<section class="screen">${top('Current Plan Brief','An immutable version you explicitly approved.')}<div class="card"><span class="badge green">Current · version ${['briefStale','briefConcurrent'].includes(state.scenario)?'3':'3'}</span><h2 class="card-title">Prove repeatable first value</h2><p class="card-copy">Guide three design partners to a visible first success before expanding onboarding.</p><p class="card-copy"><strong>Success evidence:</strong> Three partners complete the first-value checkpoint without live intervention.</p><p class="meta">Saved 19th August 2026 · 1 attributed source · brief-v3</p></div>${notice(state.scenario==='briefDuplicate'?'Version already saved once.':state.scenario==='briefPartial'?'Recovered after an interrupted response.':'Version 3 is current.',state.scenario==='briefDuplicate'?'The original matching version was returned; no duplicate was created.':state.scenario==='briefPartial'?'The original request key restored the committed version.':'New research cannot replace it without another review.','green')}${btn('Version history','history','primary')}${btn('Review research','researchCards')}${btn('Back to Plan','hub','ghost')}</section>`,
    history:()=>`<section class="screen">${top('Plan Brief history','Every approved version keeps its evidence and recorded time.')}<div class="card"><div class="version"><span class="badge green">v3</span><div><h3>Prove repeatable first value</h3><p>Current · 1 source · 19th August 2026</p></div></div><div class="version"><span class="badge">v2</span><div><h3>Validate customer activation</h3><p>Previous · 2 sources · 17th August 2026</p></div></div><div class="version"><span class="badge">v1</span><div><h3>Define first proof of progress</h3><p>Original · 1 source · 15th August 2026</p></div></div></div>${notice('Versions are never overwritten.','Open any version to inspect its exact text and sources.')} ${btn('Back to current brief','briefCurrent','primary')}</section>`,
    failure:()=>`<section class="screen">${top('Your confirmed work is safe.')}${failure()}</section>`
  };
  function render(){const bar=`<header class="demo-bar"><div class="demo-identity"><span class="demo-brand">Longview</span><span class="demo-tag">Release 5 acceptance</span></div><div class="demo-menus"><select id="screen" aria-label="Screen">${Object.entries(screens).map(([k,v])=>`<option value="${k}" ${state.screen===k?'selected':''}>${v}</option>`).join('')}</select><select id="scenario" aria-label="Scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="demo-reset" data-action="reset">Reset</button></header>`;root.innerHTML=`<div class="prototype-page">${bar}<div class="prototype-stage"><section class="device phone mweb"><div class="browser-chrome"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span class="address">Local review · not deployed</span></div><main class="viewport">${views[state.screen]()}</main><nav class="bottom-nav"><button class="bottom-item">Today</button><button class="bottom-item">Calendar</button><button class="bottom-item on" data-go="hub">Plans</button><button class="bottom-item">Settings</button></nav></section></div></div>`;root.querySelector('#screen').onchange=e=>{state.screen=e.target.value;render()};root.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;render()}}
  root.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-action]');if(!t)return;if(t.dataset.go)state.screen=t.dataset.go;const a=t.dataset.action;if(a==='reset')Object.assign(state,{screen:'hub',scenario:'success',decision:'pending',operation:'research',draft:{...defaults}});if(a==='cancel-research'){state.operation='research';state.screen=state.scenario==='cancelResearch'?'failure':'hub'}if(a==='research-result'){state.operation='research';state.screen=['cancelResearch','timeout','malformed','offlineResearch','missingAttribution'].includes(state.scenario)?'failure':'researchCards'}if(['accept','reject','defer'].includes(a)){state.decision=a;state.operation='review';state.screen='reviewSaving'}if(a==='review-result'){state.screen=['reviewOffline','reviewConcurrent','reviewPartial'].includes(state.scenario)?'failure':'researchCards'}if(a==='proposal-result')state.screen='proposalEdit';if(a==='review-proposal'){state.draft={title:document.querySelector('#brief-title').value,approach:document.querySelector('#brief-approach').value,proof:document.querySelector('#brief-proof').value};state.screen='proposalReview'}if(a==='defer-proposal'){state.operation='brief';state.screen='hub'}if(a==='save-brief'){state.operation='brief';state.screen='briefSaving'}if(a==='brief-result'){state.screen=['briefOffline','briefStale','briefConcurrent'].includes(state.scenario)?'failure':'briefCurrent'}render()});render();
})();
</script></body></html>
