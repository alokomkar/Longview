<!doctype html>
<html lang="en" data-palette="ocean" data-mode="dark" data-font="lora" data-size="default">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longview Release 4 durable Plan record</title>
  <link rel="stylesheet" href="longview-release-prototype.css">
</head>
<body data-platform="mweb"><main id="prototype" aria-live="polite"></main>
<script>
(() => {
  const screens={record:'Plan record',history:'Execution history',decisionDraft:'Add decision',decisionReview:'Review decision',decisionSaving:'Saving decision',decisions:'Decisions',claraLoading:'Clara working',claraReady:'Clara guidance',guidanceReview:'Review retained guidance',guidanceSaving:'Saving guidance',guidanceSaved:'Guidance saved',failure:'Failure and recovery'};
  const scenarios={success:'Successful save',cancel:'Cancelled review',timeout:'Clara timeout',malformed:'Invalid Clara response',offline:'Offline write',concurrent:'Concurrent save',duplicate:'Duplicate retry',partial:'Response lost after save',readError:'Record unavailable',planMissing:'Plan missing'};
  const state={screen:'record',scenario:'success',operation:'decision'}; const root=document.getElementById('prototype');
  const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
  const action=(label,name,cls='')=>`<button class="btn ${cls}" data-action="${name}">${label}</button>`;
  const top=(title,copy='')=>`<div class="topline"><strong>Longview</strong><span class="badge green">Release 4 · Plan record</span></div><h1 class="page-title">${title}</h1>${copy?`<p class="page-sub">${copy}</p>`:''}`;
  const notice=(title,copy,kind='')=>`<div class="notice"><span class="badge ${kind}">${kind==='rose'?'Safe stop':'Durable proof'}</span><div><strong>${title}</strong><span>${copy}</span></div></div>`;
  const progress=label=>`<div class="clara-wait"><div class="clara-mark">L</div><h2>${label}</h2><p>The current Plan record stays available while this finishes.</p><div class="clara-progress" role="progressbar" aria-label="${label}"><span></span></div></div>`;
  const timeline=()=>`<div class="schedule"><div class="slot"><span>18 Aug</span><div class="slot-body"><b>Completed · Define the first proof of progress</b><span>60 minutes · completion first-proof-v1-0818</span></div></div><div class="slot"><span>17 Aug</span><div class="slot-body"><b>Approved schedule change</b><span>Added Wednesday after explicit review · approval-123</span></div></div></div>`;
  const failure=()=>{const values={cancel:['Review cancelled.','The draft or recommendation is still available in this session. No Plan record was added.','Return to Plan'],timeout:['Clara did not respond in time.','The request stopped safely. No guidance was retained.','Try Clara again'],malformed:['This guidance could not be used.','The response failed validation. No Plan record was created.','Ask again'],offline:['You are offline.','The reviewed draft is still here. No Plan record was added.','Retry save'],concurrent:['This save was completed in another tab.','The original matching record was restored; no duplicate was added.','View saved record'],partial:['The response was interrupted.','Longview found the committed record by its original key and restored it.','View recovered record'],readError:['The Plan record could not be loaded.','The saved Plan is unchanged. No stale history is being shown.','Retry record'],planMissing:['This Plan is no longer available.','No cached details or record are shown.','Return to Plans']};const v=values[state.scenario]||values.offline;return `${notice(v[0],v[1],'rose')}${btn(v[2],state.scenario==='cancel'?'record':['concurrent','partial'].includes(state.scenario)?(state.operation==='guidance'?'guidanceSaved':'decisions'):state.scenario==='planMissing'?'record':state.scenario==='readError'?'history':state.operation==='guidance'?'claraLoading':'decisionSaving','primary')}${btn('Return without changes','record','ghost')}`};
  const views={
    record:()=>state.scenario==='planMissing'?`<section class="screen">${top('Plan unavailable.')}${failure()}</section>`:`<section class="screen">${top('Build SaaS Startup','Plan Details keeps execution and reasoning with the work.')}<div class="card"><span class="section-label">Plan overview</span><h2 class="card-title">Validate customer activation</h2><p class="card-copy">Prove that three design partners reach first value every week.</p><p class="meta">Target 31st October 2026 · 6 hours/week · Mon, Wed, Fri</p></div>${notice('2 recorded events · 1 decision · 1 retained guidance','Nothing is generated or saved by opening this page.')}${btn('Execution history','history','primary')}${btn('Decisions','decisions')}${btn('Relevant Clara guidance','guidanceSaved')}${btn('Ask Clara about this Plan','claraLoading','ghost')}</section>`,
    history:()=>state.scenario==='readError'?`<section class="screen">${top('Execution history unavailable.')}${failure()}</section>`:`<section class="screen">${top('Execution history','Immutable evidence from this Plan, newest first.')}${timeline()}${notice('Source proof stays attached.','Completions and approved changes remain in their authoritative records.')}${btn('Back to Plan record','record','primary')}</section>`,
    decisionDraft:()=>`<section class="screen">${top('Record a decision','Capture the conclusion and why it matters.')}<div class="field"><label>Decision</label><textarea class="input">Keep the onboarding test narrow until three partners reach first value.</textarea></div><div class="field"><label>Rationale</label><textarea class="input">Expanding scope now would hide whether the current activation path works.</textarea></div>${btn('Review decision','decisionReview','primary')}${btn('Cancel','decisions','ghost')}</section>`,
    decisionReview:()=>`<section class="screen">${top('Review this decision','This exact text will become an immutable Plan record.')}<div class="card"><span class="section-label">Decision</span><h2 class="card-title">Keep the onboarding test narrow until three partners reach first value.</h2><p><strong>Why:</strong> Expanding scope now would hide whether the current activation path works.</p><p class="meta">Plan · Build SaaS Startup</p></div>${notice('Nothing has been saved.','Confirm only if this belongs in the durable Plan record.')}${action('Save decision','save-decision','primary')}${btn('Edit','decisionDraft')}${action('Cancel without saving','cancel','ghost')}</section>`,
    decisionSaving:()=>`<section class="screen">${top('Saving your decision…','Checking the Plan and original request key together.')}${progress('Saving one immutable decision…')}${action('Show result','decision-result','primary')}</section>`,
    decisions:()=>`<section class="screen">${top('Decisions','Conclusions and their rationale, retained with this Plan.')}<div class="card"><span class="badge green">18th August 2026</span><h2 class="card-title">Keep the onboarding test narrow</h2><p class="card-copy">Expanding scope now would hide whether the current activation path works.</p><p class="meta">Decision record · decision-0818-01</p></div>${notice(state.scenario==='duplicate'?'Already saved once.':'One immutable decision',state.scenario==='duplicate'?'The original matching record was returned; no duplicate was created.':'Editing and deletion are outside this release.')}${btn('Add decision','decisionDraft','primary')}${btn('Back to Plan record','record','ghost')}</section>`,
    claraLoading:()=>`<section class="screen">${top('Clara is reviewing this Plan…','Only this Plan and its validated record are in context.')}${progress('Preparing read-only guidance…')}${action('Show response','clara-result','primary')}${action('Cancel Clara','cancel','ghost')}</section>`,
    claraReady:()=>`<section class="screen">${top('Protect the activation proof','Read-only guidance · medium confidence')}<div class="card"><p class="card-copy">Finish the three partner sessions before adding another onboarding path.</p><p><strong>Why:</strong> The latest decision keeps scope narrow and the target is close enough to prefer evidence over expansion.</p></div><div class="notice"><span class="badge blue">Context used</span><div><strong>This Plan only</strong><span>Outcome, target, current step, latest decision, and two execution events.</span></div></div><p class="meta">Nothing has been retained or changed.</p>${btn('Review saving this guidance','guidanceReview','primary')}${btn('Close without saving','record','ghost')}</section>`,
    guidanceReview:()=>`<section class="screen">${top('Save this guidance to the Plan?','Review the exact snapshot that will remain available later.')}<div class="card"><span class="section-label">Recommendation · medium confidence</span><h2 class="card-title">Protect the activation proof</h2><p class="card-copy">Finish the three partner sessions before adding another onboarding path.</p><p><strong>Rationale:</strong> Prefer evidence over expansion while the target is close.</p><p class="meta">Sources: outcome, target, current step, latest decision, two execution events</p></div>${notice('Nothing has been saved.','Future Clara requests do not overwrite this snapshot.')}${action('Save to this Plan','save-guidance','primary')}${action('Cancel without saving','cancel','ghost')}</section>`,
    guidanceSaving:()=>`<section class="screen">${top('Saving the guidance you reviewed…','Checking the source recommendation and original request key.')}${progress('Saving one guidance snapshot…')}${action('Show result','guidance-result','primary')}</section>`,
    guidanceSaved:()=>`<section class="screen">${top('Relevant Clara guidance','Only recommendations you deliberately retained appear here.')}<div class="card"><span class="badge green">Saved 18th August 2026</span><h2 class="card-title">Protect the activation proof</h2><p class="card-copy">Finish the three partner sessions before adding another onboarding path.</p><p><strong>Why:</strong> Prefer evidence over expansion while the target is close.</p><p class="meta">Medium confidence · guidance-0818-01 · 5 source facts</p></div>${notice(state.scenario==='duplicate'?'Already saved once.':state.scenario==='partial'?'Recovered after an interrupted response.':'Saved to this Plan.',state.scenario==='duplicate'?'The original record was returned; no duplicate was added.':state.scenario==='partial'?'The original request key restored the committed record.':'This snapshot will not be silently replaced.')}${btn('Ask Clara again','claraLoading','primary')}${btn('Back to Plan record','record','ghost')}</section>`,
    failure:()=>`<section class="screen">${top('Nothing new was added.')}${failure()}</section>`
  };
  function render(){const displayed=state.screen==='record'&&state.scenario==='planMissing'?'failure':state.screen;const bar=`<header class="demo-bar"><div class="demo-identity"><span class="demo-brand">Longview</span><span class="demo-tag">Release 4 acceptance</span></div><div class="demo-menus"><select id="screen">${Object.entries(screens).map(([k,v])=>`<option value="${k}" ${state.screen===k?'selected':''}>${v}</option>`).join('')}</select><select id="scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="demo-reset" data-action="reset">Reset</button></header>`;root.innerHTML=`<div class="prototype-page">${bar}<div class="prototype-stage"><section class="device phone mweb"><div class="browser-chrome"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span class="address">Local review · not deployed</span></div><main class="viewport">${views[displayed]()}</main><nav class="bottom-nav"><button class="bottom-item">Today</button><button class="bottom-item">Calendar</button><button class="bottom-item on" data-go="record">Plans</button><button class="bottom-item">Settings</button></nav></section></div></div>`;root.querySelector('#screen').onchange=e=>{state.screen=e.target.value;render()};root.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;render()}}
  root.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-action]');if(!t)return;if(t.dataset.go)state.screen=t.dataset.go;const a=t.dataset.action;if(a==='reset')Object.assign(state,{screen:'record',scenario:'success',operation:'decision'});if(a==='cancel'){state.screen=state.scenario==='cancel'?'failure':'record';}if(a==='save-decision'){state.operation='decision';state.screen='decisionSaving'}if(a==='decision-result'){state.screen=['offline'].includes(state.scenario)?'failure':['concurrent','partial'].includes(state.scenario)?'failure':'decisions'}if(a==='clara-result'){state.operation='guidance';state.screen=['timeout','malformed'].includes(state.scenario)?'failure':'claraReady'}if(a==='save-guidance'){state.operation='guidance';state.screen='guidanceSaving'}if(a==='guidance-result'){state.screen=['offline','concurrent'].includes(state.scenario)?'failure':'guidanceSaved'}render()});render();
})();
</script></body></html>
