<!doctype html>
<html lang="en" data-palette="ocean" data-mode="dark" data-font="lora" data-size="default">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longview Release 6 Plan achievement and reuse consent</title>
  <link rel="stylesheet" href="longview-release-prototype.css">
  <style>
    .proof{border-left:3px solid var(--green)}.consent-list{display:grid;gap:8px;margin:12px 0}.consent-row{padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}.consent-row b{display:block;font-size:10.5px}.consent-row span{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.45}.consent-row input{width:20px;height:20px;accent-color:var(--accent)}.summary-group{margin:12px 0}.summary-group>strong{display:block;margin-bottom:7px;color:var(--accent);font-size:9px;letter-spacing:.09em;text-transform:uppercase}.evidence-line{padding:8px 0;border-bottom:1px solid var(--rule);font-size:9.5px}.evidence-line:last-child{border:0}.privacy-key{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.privacy-key .metric b{font-size:13px}.is-hidden{display:none}
  </style>
</head>
<body data-platform="mweb"><main id="prototype" aria-live="polite"></main>
<script>
(() => {
  const screens={plan:'Plan details',blocked:'Finish unavailable',evidence:'Completion evidence',reflection:'Private reflection',consent:'Reuse consent',review:'Final review',saving:'Saving achievement',record:'Achievement record',revokeReview:'Review revocation',revoking:'Saving revocation',failure:'Failure and recovery'};
  const scenarios={success:'Successful selective consent',unfinished:'Required step unfinished',cancel:'Cancel before save',noReflection:'Finish without reflection',reuseNothing:'Reuse nothing',invalidOutcome:'Empty outcome',invalidEvidence:'Missing evidence',invalidUrl:'Invalid evidence URL',offlineSave:'Save unavailable offline',responseLost:'Response lost after commit',duplicate:'Duplicate save retry',stale:'Plan changed in another tab',concurrent:'Plan completed in another tab',partial:'Atomic write interrupted',malformedRead:'Malformed achievement read',revokeOffline:'Revocation unavailable offline',revokeConflict:'Consent changed in another tab'};
  const defaults={outcome:'Three design partners reached first value without live intervention.',label1:'Activation results — cohort 01',url1:'https://example.com/evidence/activation-cohort-01',label2:'Partner interview summary',url2:'',worked:'A visible first-value checkpoint kept the rollout focused.',changed:'The onboarding checklist became shorter after the first partner session.',different:'Validate the import path before inviting the next cohort.'};
  const state={screen:'plan',scenario:'success',draft:{...defaults},consent:new Set(),saved:false,revoked:false};
  const root=document.getElementById('prototype');
  const esc=value=>String(value||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
  const action=(label,name,cls='')=>`<button class="btn ${cls}" data-action="${name}">${label}</button>`;
  const top=(title,copy='')=>`<div class="topline"><strong>Longview</strong><span class="badge green">Release 6 · Achievement</span></div><h1 class="page-title">${title}</h1>${copy?`<p class="page-sub">${copy}</p>`:''}`;
  const notice=(title,copy,kind='blue')=>`<div class="notice"><span class="badge ${kind}">${kind==='rose'?'Safe stop':kind==='green'?'Confirmed':'Private first'}</span><div><strong>${title}</strong><span>${copy}</span></div></div>`;
  const progress=label=>`<div class="clara-wait"><div class="achievement-mark">✓</div><h2>${label}</h2><p>Your Plan stays active until the complete achievement record is confirmed.</p><div class="clara-progress" role="progressbar" aria-label="${label}"><span></span></div></div>`;
  const fields=['worked','changed','different'];
  const fieldNames={worked:'What worked',changed:'What changed',different:'Do differently'};
  const nonEmpty=()=>fields.filter(key=>state.draft[key].trim());
  const selected=()=>nonEmpty().filter(key=>state.consent.has(key));
  const privateOnly=()=>nonEmpty().filter(key=>!state.consent.has(key));
  const capture=()=>{[['outcome','outcome'],['label1','label1'],['url1','url1'],['label2','label2'],['url2','url2'],['worked','worked'],['changed','changed'],['different','different']].forEach(([id,key])=>{const el=document.getElementById(id);if(el)state.draft[key]=el.value})};
  const reflectionCard=(key,kind='')=>state.draft[key].trim()?`<div class="card ${kind}"><span class="section-label">${fieldNames[key]}</span><p class="card-copy">${esc(state.draft[key])}</p></div>`:'';
  const consentRows=()=>nonEmpty().map(key=>`<label class="consent-row"><div><b>${fieldNames[key]}</b><span>${esc(state.draft[key])}</span></div><input type="checkbox" data-consent="${key}" ${state.consent.has(key)?'checked':''} aria-label="Allow Clara to reuse ${fieldNames[key]}"></label>`).join('');
  const failureValues={
    invalidOutcome:['Add the outcome you achieved.','A measurable outcome is required before this Plan can finish.','Return to evidence','evidence'],
    invalidEvidence:['Add at least one evidence reference.','Give the proof a clear label. Nothing has been saved.','Return to evidence','evidence'],
    invalidUrl:['Use a secure evidence link.','Links must begin with https://. You may also leave the link blank and keep the label.','Fix evidence link','evidence'],
    offlineSave:['You appear to be offline.','Your exact draft remains here. The Plan is still active and no reusable learning was saved.','Retry same save','saving'],
    responseLost:['The confirmation was interrupted.','Longview will check the original request before trying another write.','Restore saved achievement','record'],
    stale:['This Plan changed in another tab.','Nothing from this draft replaced the newer Plan. Reload the latest steps before finishing.','Reload Plan','plan'],
    concurrent:['This Plan was already finished.','Longview kept the original achievement and did not create a second one.','View achievement','record'],
    partial:['The achievement was not confirmed.','The atomic save left the Plan active and created no reusable memory. Your draft is still available.','Retry same save','saving'],
    malformedRead:['The achievement record could not be displayed.','No unverified evidence or reuse permission is being shown.','Retry achievement','record'],
    revokeOffline:['Reuse permission was not changed.','The current permission remains in place until a revocation is confirmed.','Retry revocation','revoking'],
    revokeConflict:['Reuse permission changed in another tab.','Longview loaded the latest permission instead of overwriting it.','Review latest permission','record']
  };
  const failure=()=>{const v=failureValues[state.scenario]||failureValues.offlineSave;return `${notice(v[0],v[1],'rose')}${btn(v[2],v[3],'primary')}${btn('Return without changes',state.saved?'record':'plan','ghost')}`};
  const views={
    plan:()=>`<section class="screen">${top('Validate customer activation','All required steps are complete. Finishing records what changed; it does not ask Clara to judge the result.')}<div class="achievement-hero"><div class="achievement-mark">12</div><div><h2>12 of 12 required steps complete</h2><p>14 weeks · target 19th August 2026 · Plan revision 8</p></div></div>${notice('Your Plan is still active.','Nothing becomes completed until you review and confirm the achievement.')} ${action('Finish Plan','start-finish','primary')}${btn('Back to Plan details','plan','ghost')}</section>`,
    blocked:()=>`<section class="screen">${top('This Plan is not ready to finish.','One required step still needs a confirmed completion.')}<div class="card task-card"><span class="badge amber">1 required step remaining</span><h2 class="card-title">Confirm the first-value checkpoint</h2><p class="card-copy">Record the observable result from the final partner session.</p></div>${notice('No achievement can be created yet.','Optional steps do not block finishing; required steps do.','rose')}${btn('Return to current step','plan','primary')}</section>`,
    evidence:()=>`<section class="screen">${top('Record what you achieved','Use proof you can recognize later. One evidence label is required; links are optional.')}<div class="field"><label for="outcome">Measurable outcome</label><textarea id="outcome" class="input">${esc(state.draft.outcome)}</textarea></div><div class="card proof"><span class="section-label">Evidence 1 · required</span><div class="field"><label for="label1">Evidence label</label><input id="label1" class="input" value="${esc(state.draft.label1)}"></div><div class="field"><label for="url1">Secure link · optional</label><input id="url1" class="input" inputmode="url" value="${esc(state.draft.url1)}"></div></div><div class="card proof"><span class="section-label">Evidence 2 · optional</span><div class="field"><label for="label2">Evidence label</label><input id="label2" class="input" value="${esc(state.draft.label2)}"></div><div class="field"><label for="url2">Secure link · optional</label><input id="url2" class="input" inputmode="url" value="${esc(state.draft.url2)}"></div></div>${action('Continue to reflection','evidence-next','primary')}${action('Cancel finishing','cancel','ghost')}</section>`,
    reflection:()=>`<section class="screen">${top('Reflect privately','All three prompts are optional. Your words remain private unless you select an exact statement on the next screen.')}<div class="field"><label for="worked">What worked?</label><textarea id="worked" class="input">${esc(state.draft.worked)}</textarea></div><div class="field"><label for="changed">What changed?</label><textarea id="changed" class="input">${esc(state.draft.changed)}</textarea></div><div class="field"><label for="different">What would you do differently?</label><textarea id="different" class="input">${esc(state.draft.different)}</textarea></div>${action('Choose what Clara may reuse','reflection-next','primary')}${action('Skip reflection','skip-reflection')}${action('Cancel finishing','cancel','ghost')}</section>`,
    consent:()=>`<section class="screen">${top('Choose exactly what Clara may reuse','No statement is required. Permission applies only to future Plan guidance.')} ${nonEmpty().length?`<div class="consent-list">${consentRows()}</div>${action('Reuse nothing','reuse-none','ghost')}`:notice('There is no reflection to reuse.','Your completion evidence remains part of this Plan, not reusable reflection.')} ${notice(selected().length?`${selected().length} statement${selected().length===1?'':'s'} selected.`:'Reuse is off.','You will see the exact private and reusable content once more before saving.',selected().length?'green':'blue')}${action('Review finish','review-finish','primary')}${btn('Edit reflection','reflection')}${action('Cancel finishing','cancel','ghost')}</section>`,
    review:()=>`<section class="screen">${top('Review before finishing','Confirm the achievement and the exact boundary between private reflection and reusable learning.')}<div class="summary-group"><strong>Completion evidence</strong><div class="card proof"><h2 class="card-title">${esc(state.draft.outcome)}</h2><div class="evidence-line">${esc(state.draft.label1)}${state.draft.url1?` · secure link attached`:''}</div>${state.draft.label2?`<div class="evidence-line">${esc(state.draft.label2)}${state.draft.url2?' · secure link attached':''}</div>`:''}</div></div><div class="privacy-key"><div class="metric"><b>${privateOnly().length}</b><span>Private statements</span></div><div class="metric"><b>${selected().length}</b><span>Reusable statements</span></div></div><div class="summary-group"><strong>Clara may reuse</strong>${selected().length?selected().map(key=>reflectionCard(key,'research')).join(''):notice('Reuse nothing.','No reflection will be added to future Clara context.')}</div><div class="summary-group"><strong>Private reflection</strong>${privateOnly().length?privateOnly().map(key=>reflectionCard(key)).join(''):`<p class="meta">No private reflection statements.</p>`}</div>${notice('Nothing has been saved.','Save creates one immutable achievement and one consent snapshot together.')} ${action('Finish and save','save','primary')}${btn('Change reuse choices','consent')}${action('Cancel finishing','cancel','ghost')}</section>`,
    saving:()=>`<section class="screen">${top('Saving your achievement…','Checking completed steps, Plan revision, evidence, and the original request key.')}${progress('Finishing this Plan safely…')}${action('Show result','save-result','primary')}</section>`,
    record:()=>state.scenario==='malformedRead'?`<section class="screen">${top('Achievement unavailable.')}${failure()}</section>`:`<section class="screen">${top('Plan achieved','The completed journey and reuse boundary are now part of this Plan.')}<div class="achievement-hero"><div class="achievement-mark">✓</div><div><h2>Three partners reached first value</h2><p>Completed 19th August 2026 · achievement-0819-01</p></div></div><div class="card proof"><span class="badge green">Evidence confirmed</span><p class="card-copy">${esc(state.draft.outcome)}</p><p class="meta">2 references · 12 completed required steps · Plan revision 8</p></div>${notice(state.scenario==='duplicate'?'Achievement already saved once.':state.scenario==='responseLost'?'Achievement restored after an interrupted response.':'Achievement saved once.',state.scenario==='duplicate'?'The original matching result was returned; no duplicate was created.':state.scenario==='responseLost'?'The original request key restored the committed result.':'Completion evidence and reflection were committed atomically.','green')}<div class="card reflection-card"><span class="section-label">Future Clara reuse</span><p class="card-copy">${state.revoked||selected().length===0?'Reuse is off.':`${selected().length} exact reflection statement${selected().length===1?'':'s'} approved.`}</p><p class="meta">Purpose: future Plan guidance · consent revision ${state.revoked?'2':'1'}</p></div>${state.revoked||selected().length===0?'':btn('Stop future reuse','revokeReview','danger')}${btn('View all Plans','plan','primary')}</section>`,
    revokeReview:()=>`<section class="screen">${top('Stop future reuse?','The achievement and private reflection stay in this Plan.')}<div class="card research"><span class="section-label">Currently reusable</span>${selected().map(key=>`<p class="card-copy"><strong>${fieldNames[key]}:</strong> ${esc(state.draft[key])}</p>`).join('')}</div>${notice('This affects future requests only.','It does not claim to remove text from guidance already generated.')} ${action('Confirm stop future reuse','revoke','danger')}${btn('Keep current permission','record','primary')}</section>`,
    revoking:()=>`<section class="screen">${top('Updating reuse permission…','The current consent remains authoritative until this revision is confirmed.')}${progress('Saving consent revision…')}${action('Show result','revoke-result','primary')}</section>`,
    failure:()=>`<section class="screen">${top('Your confirmed work is safe.')}${failure()}</section>`
  };
  function render(){const bar=`<header class="demo-bar"><div class="demo-identity"><span class="demo-brand">Longview</span><span class="demo-tag">Release 6 acceptance</span></div><div class="demo-menus"><select id="screen" aria-label="Screen">${Object.entries(screens).map(([k,v])=>`<option value="${k}" ${state.screen===k?'selected':''}>${v}</option>`).join('')}</select><select id="scenario" aria-label="Scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="demo-reset" data-action="reset">Reset</button></header>`;root.innerHTML=`<div class="prototype-page">${bar}<div class="prototype-stage"><section class="device phone mweb"><div class="browser-chrome"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span class="address">Local review · not deployed</span></div><main class="viewport">${views[state.screen]()}</main><nav class="bottom-nav"><button class="bottom-item">Today</button><button class="bottom-item">Calendar</button><button class="bottom-item on" data-go="plan">Plans</button><button class="bottom-item">Settings</button></nav></section></div></div>`;root.querySelector('#screen').onchange=e=>{capture();state.screen=e.target.value;render()};root.querySelector('#scenario').onchange=e=>{capture();state.scenario=e.target.value;render()};root.querySelectorAll('[data-consent]').forEach(el=>el.onchange=()=>{el.checked?state.consent.add(el.dataset.consent):state.consent.delete(el.dataset.consent);render()})}
  root.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-action]');if(!t)return;capture();if(t.dataset.go)state.screen=t.dataset.go;const a=t.dataset.action;if(a==='reset')Object.assign(state,{screen:'plan',scenario:'success',draft:{...defaults},consent:new Set(),saved:false,revoked:false});if(a==='start-finish')state.screen=state.scenario==='unfinished'?'blocked':'evidence';if(a==='cancel'){state.screen='plan';state.saved=false}if(a==='evidence-next'){if(state.scenario==='invalidOutcome')state.draft.outcome='';if(state.scenario==='invalidEvidence')state.draft.label1='';if(state.scenario==='invalidUrl')state.draft.url1='http://unsafe.example';state.screen=['invalidOutcome','invalidEvidence','invalidUrl'].includes(state.scenario)?'failure':'reflection'}if(a==='reflection-next'){if(state.scenario==='noReflection'){fields.forEach(key=>state.draft[key]='');state.consent.clear()}if(state.scenario==='reuseNothing')state.consent.clear();state.screen='consent'}if(a==='skip-reflection'){fields.forEach(key=>state.draft[key]='');state.consent.clear();state.screen='consent'}if(a==='reuse-none'){state.consent.clear();state.screen='consent'}if(a==='review-finish')state.screen='review';if(a==='save')state.screen='saving';if(a==='save-result'){if(['offlineSave','responseLost','stale','concurrent','partial'].includes(state.scenario))state.screen='failure';else{state.saved=true;state.screen='record'}}if(a==='revoke')state.screen='revoking';if(a==='revoke-result'){if(['revokeOffline','revokeConflict'].includes(state.scenario))state.screen='failure';else{state.revoked=true;state.screen='record'}}render()});render();
})();
</script></body></html>
