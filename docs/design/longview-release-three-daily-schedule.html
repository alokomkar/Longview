<!doctype html>
<html lang="en" data-palette="ocean" data-mode="dark" data-font="lora" data-size="default">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longview Release 3 daily schedule</title>
  <link rel="stylesheet" href="longview-release-prototype.css">
</head>
<body data-platform="mweb"><main id="prototype" aria-live="polite"></main>
<script>
(() => {
  const screens={calendar:'Calendar',preparing:'Preparing',proposal:'Review proposal',saving:'Saving approval',approved:'Approved day',breakPreview:'Review break',breakSaving:'Saving break',breakDone:'Break saved',failure:'Failure and recovery'};
  const scenarios={success:'New approval',replacement:'Safe replacement',cancel:'Cancelled',timeout:'Timed out',offline:'Offline',malformed:'Invalid response',stale:'Stale replacement',duplicate:'Duplicate approval',futureConflict:'Future-day conflict',noEligible:'No eligible carry day',breakDuplicate:'Duplicate break'};
  const state={screen:'calendar',scenario:'success'}; const root=document.getElementById('prototype');
  const btn=(label,go,cls='')=>`<button class="btn ${cls}" data-go="${go}">${label}</button>`;
  const top=(title,copy='')=>`<div class="topline"><strong>Longview</strong><span class="badge green">Release 3 · review first</span></div><h1 class="page-title">${title}</h1>${copy?`<p class="page-sub">${copy}</p>`:''}`;
  const blocks=()=>`<div class="schedule"><div class="slot"><span>First</span><div class="slot-body"><b>Confirm three customer interviews</b><span>Build SaaS Startup · 45 minutes</span></div></div><div class="slot"><span>Then</span><div class="slot-body"><b>Evaluate retrieval baseline</b><span>Learn AI / ML Application · 30 minutes</span></div></div></div>`;
  const progress=(label,checkpoint)=>`<div class="clara-wait"><div class="clara-mark">L</div><h2>${label}</h2><p>Your approved work remains available while this request finishes.</p><div class="clara-progress" role="progressbar" aria-label="${label}"><span></span></div><p class="meta">Checkpoint ${checkpoint} of 4 · keep this page open</p></div>`;
  const notice=(title,copy,kind='')=>`<div class="notice"><span class="badge ${kind}">${kind==='rose'?'Safe stop':'No silent change'}</span><div><strong>${title}</strong><span>${copy}</span></div></div>`;
  const failure=()=>{
    const values={cancel:['Run cancelled.','No proposal was published. Your approved day and Plans are unchanged.','Start a new run'],timeout:['This took too long.','The deadline ended the run safely. Your approved day and Plans are unchanged.','Start a new run'],offline:['You appear to be offline.','Reconnect before preparing today. Nothing was changed.','Try again'],malformed:['This proposal could not be used.','The response did not pass Longview’s safety checks. Nothing was saved.','Prepare again'],stale:['This proposal is out of date.','Another session changed today after this preview. The latest approved revision was preserved.','Review latest day'],futureConflict:['No future day was overwritten.','A carry destination already has an approved order. Today and every future day remain unchanged.','Keep today’s order'],noEligible:['One task has nowhere safe to go.','Add a future working day to that Plan before taking a break. Nothing moved.','Review Plan schedules']};
    const v=values[state.scenario]||values.timeout; return `${notice(v[0],v[1],'rose')}${btn(v[2],state.scenario==='stale'?'approved':state.scenario==='futureConflict'?'approved':state.scenario==='noEligible'?'calendar':'preparing','primary')}${btn('Return to Today','calendar','ghost')}`;
  };
  const views={
    calendar:()=>`<section class="screen">${top('Prepare today across your Plans.','Choose a planning window. You will review a proposal before anything is saved.')}<div class="field"><label>Planning window</label><select class="input"><option>120 minutes</option><option>90 minutes</option><option>60 minutes</option></select></div>${notice('3 unfinished Plans are eligible.','Completed steps are excluded before a run begins.')}${btn('Prepare today','preparing','primary')}</section>`,
    preparing:()=>`<section class="screen">${top('Your proposal is being prepared.','Only today’s eligible Plans and the selected capacity are being checked.')}${progress('Generating a safe order…',3)}${btn('Cancel run','failure','ghost')}<button class="btn primary" data-action="publish">Show proposal</button></section>`,
    proposal:()=>`<section class="screen">${top('A workable order for today.','75 of 120 minutes · 45 minutes remain unallocated')}${blocks()}${notice(state.scenario==='replacement'?'Revision 2 is still approved.':'Nothing has been saved yet.',state.scenario==='replacement'?'Approval will replace only this exact day after a latest-revision check.':'Approve only if this order works for you.')}${btn(state.scenario==='replacement'?'Replace approved day':'Approve this order','saving','primary')}${btn('Adjust planning window','calendar','ghost')}${btn('Prepare a different proposal','preparing','ghost')}</section>`,
    saving:()=>`<section class="screen">${top(state.scenario==='replacement'?'Replacing today safely…':'Saving the order you reviewed…','The current approved day remains available until the transaction completes.')}${progress('Checking and saving together…',4)}<button class="btn primary" data-action="saved">Show result</button></section>`,
    approved:()=>`<section class="screen">${top('18th August 2026 is ready.','75 of 120 minutes · approved revision 3')}${blocks()}${notice(state.scenario==='duplicate'?'Already saved once.':'Only this day was updated.',state.scenario==='duplicate'?'The original result was restored; no duplicate revision or audit event was created.':'Future days and Plan schedules remain unchanged.')}<div class="card"><p><strong>Approval record:</strong> day-approval-123</p><p><strong>Source run:</strong> run-123</p></div>${btn('Prepare replacement','proposal','primary')}${btn('Take a break today','breakPreview','ghost')}${btn('Return to Today','calendar','ghost')}</section>`,
    breakPreview:()=>`<section class="screen">${top('Review today’s break.','Nothing will be marked complete, moved, or overwritten until you confirm.')}<div class="card"><span class="badge blue">Friday, 21st August</span><h2 class="card-title">Confirm three customer interviews</h2><p class="card-copy">Next eligible working day for Build SaaS Startup</p></div><div class="card"><span class="badge blue">Thursday, 20th August</span><h2 class="card-title">Evaluate retrieval baseline</h2><p class="card-copy">Next eligible working day for Learn AI / ML Application</p></div>${notice('Future days are not approved here.','These tasks join each destination day’s next proposal for review.')}${btn('Confirm break and carry tasks','breakSaving','primary')}${btn('Keep today’s approved order','approved','ghost')}</section>`,
    breakSaving:()=>`<section class="screen">${top('Saving today’s break…','Today remains approved until every carryover is recorded together.')}${progress('Saving break and carryovers…',4)}<button class="btn primary" data-action="breakSaved">Show result</button></section>`,
    breakDone:()=>`<section class="screen">${top('Today is marked as a break.','Nothing was marked complete.')}${notice(state.scenario==='breakDuplicate'?'This break was already saved.':'No future day was overwritten.',state.scenario==='breakDuplicate'?'The original result was restored; no duplicate carryover or audit event was created.':'You will review each destination day before it is approved.')}<div class="card"><p><strong>Break revision:</strong> 4</p><p><strong>Pending carryovers:</strong> 2</p><p><strong>Break record:</strong> break-123</p></div>${btn('Return to Today','calendar','primary')}</section>`,
    failure:()=>`<section class="screen">${top('Nothing changed.')}${failure()}</section>`
  };
  function render(){const bar=`<header class="demo-bar"><div class="demo-identity"><span class="demo-brand">Longview</span><span class="demo-tag">Release 3 acceptance</span></div><div class="demo-menus"><select id="screen">${Object.entries(screens).map(([k,v])=>`<option value="${k}" ${state.screen===k?'selected':''}>${v}</option>`).join('')}</select><select id="scenario">${Object.entries(scenarios).map(([k,v])=>`<option value="${k}" ${state.scenario===k?'selected':''}>${v}</option>`).join('')}</select></div><button class="demo-reset" data-action="reset">Reset</button></header>`;root.innerHTML=`<div class="prototype-page">${bar}<div class="prototype-stage"><section class="device phone mweb"><div class="browser-chrome"><i class="browser-dot"></i><i class="browser-dot"></i><i class="browser-dot"></i><span class="address">Local review · not deployed</span></div><main class="viewport">${views[state.screen]()}</main><nav class="bottom-nav"><button class="bottom-item">Today</button><button class="bottom-item on" data-go="calendar">Calendar</button><button class="bottom-item">Plans</button><button class="bottom-item">Settings</button></nav></section></div></div>`;root.querySelector('#screen').onchange=e=>{state.screen=e.target.value;render()};root.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;render()}}
  root.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-action]');if(!t)return;if(t.dataset.go){if(t.dataset.go==='failure'&&state.scenario==='success')state.scenario='cancel';state.screen=t.dataset.go}if(t.dataset.action==='publish')state.screen=['timeout','offline','malformed'].includes(state.scenario)?'failure':'proposal';if(t.dataset.action==='saved')state.screen=state.scenario==='stale'?'failure':'approved';if(t.dataset.action==='breakSaved')state.screen=['futureConflict','noEligible'].includes(state.scenario)?'failure':'breakDone';if(t.dataset.action==='reset')Object.assign(state,{screen:'calendar',scenario:'success'});render()});render();
})();
</script></body></html>
